<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Admin Panel - AirBy'</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0066ff">
  <style>
    :root{
        --accent:#0066ff;
        --bg:#000000;
        --card:#0b0b0c;
        --border:#1c1c1e;
        --text:#ffffff;
        --muted:#7d7d7d;
        --green:#00d26a;
        --orange:#ff9500;
        --red:#ff3b30;
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        -webkit-tap-highlight-color:transparent;
        -webkit-touch-callout:none;
        -webkit-user-select:none;
        user-select:none;
        outline:none;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }

    input,textarea{
        -webkit-user-select:auto !important;
        user-select:auto !important;
    }

    body{
        background:var(--bg);
        color:var(--text);
        min-height:100vh;
        min-height:100dvh;
        overflow-x:hidden;
        position:relative;
    }

    /* BACKGROUND */
    .market-background{
        position:fixed;
        inset:0;
        width:100%;
        height:100%;
        z-index:1;
        opacity:.12;
        display:flex;
        justify-content:space-around;
        align-items:center;
        padding:0 10px;
        pointer-events:none;
    }

    .candle-container{
        display:flex;
        flex-direction:column;
        align-items:center;
        width:12px;
        position:relative;
    }

    .wick{
        width:2px;
        height:120px;
        background-color:#34c759;
    }

    .real-body{
        width:14px;
        height:50px;
        background-color:#34c759;
        border-radius:3px;
        position:absolute;
        animation:marketFluctuation 4s ease-in-out infinite alternate;
    }

    .c1 .real-body{animation-delay:0s;height:60px;}
    .c2 .real-body{animation-delay:.8s;height:40px;}
    .c3 .real-body{animation-delay:1.5s;height:75px;}
    .c4 .real-body{animation-delay:.3s;height:35px;}
    .c5 .real-body{animation-delay:2.1s;height:55px;}

    @keyframes marketFluctuation{
        0%{transform:translateY(-15px);}
        100%{transform:translateY(15px);}
    }

    /* APP */
    .app-container{
        width:100%;
        max-width:900px;
        min-height:100vh;
        min-height:100dvh;
        margin:auto;
        padding:calc(24px + env(safe-area-inset-top)) 24px calc(100px + env(safe-area-inset-bottom)) 24px;
        position:relative;
        z-index:5;
        overflow-y:auto;
    }

    /* HEADER */
    .top-header-row{
        width:100%;
        display:grid;
        grid-template-columns:1fr auto 1fr;
        align-items:center;
        margin-bottom:28px;
    }

    .brand-logo-center{
        font-size:26px;
        font-weight:800;
        letter-spacing:-1px;
        color:#ffffff;
        text-align:center;
        grid-column:2;
    }

    .brand-logo-center .accent-tick{color:var(--accent);}
    .left-actions-group,.right-actions-group{display:flex;align-items:center;}
    .left-actions-group{justify-content:flex-start;}
    .right-actions-group{justify-content:flex-end;}

    .back-btn{
        width:44px;
        height:44px;
        background:var(--card);
        border:1.5px solid var(--border);
        border-radius:14px;
        display:flex;
        justify-content:center;
        align-items:center;
        transition:.2s cubic-bezier(0.34,1.56,0.64,1);
        cursor:pointer;
    }

    .back-btn:active{transform:scale(.92);}
    .back-btn i{color:white;font-size:16px;}

    /* MAIN TABS - 3 TABS ONLY */
    .main-tabs{
        display:flex;
        gap:10px;
        margin-bottom:24px;
        background:var(--card);
        border:1.5px solid var(--border);
        border-radius:20px;
        padding:6px;
    }

    .main-tab-btn{
        flex:1;
        border:none;
        background:transparent;
        color:var(--muted);
        border-radius:14px;
        padding:14px 12px;
        font-size:13px;
        font-weight:700;
        cursor:pointer;
        transition:.25s cubic-bezier(0.34,1.56,0.64,1);
    }

    .main-tab-btn.active{
        background:var(--accent);
        color:white;
        box-shadow:0 8px 20px rgba(0,102,255,.3);
    }

    .main-tab-btn:active{transform:scale(.96);}

    /* TAB CONTENT */
    .tab-content{
        display:none;
        animation:fadeIn .4s ease;
    }

    .tab-content.active{
        display:block;
    }

    /* SECTION */
    .section{
        background:var(--card);
        border:1.5px solid var(--border);
        border-radius:24px;
        padding:24px 20px;
        margin-bottom:24px;
        box-shadow:0 10px 30px rgba(0,0,0,.4);
    }

    .section h2{
        color:var(--accent);
        margin-bottom:16px;
        font-size:22px;
        font-weight:800;
    }

    /* WITHDRAWAL ORDERS */
    .order{
        background:#050505;
        margin-bottom:14px;
        padding:16px;
        border-radius:18px;
        border:1.5px solid var(--border);
        display:flex;
        flex-direction:column;
        gap:8px;
        transition:transform .25s cubic-bezier(0.34,1.56,0.64,1);
    }

    .order:active{transform:scale(0.98);}

    .order span{
        font-size:14px;
        font-weight:600;
    }

    .order .order-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:4px;
    }

    .order .order-type{
        font-size:16px;
        font-weight:800;
        color:var(--red);
    }

    .order .order-amount{
        font-size:18px;
        font-weight:800;
        color:var(--red);
    }

    .btn{
        background:var(--accent);
        color:white;
        border:none;
        padding:10px 16px;
        margin:5px 5px 5px 0;
        border-radius:12px;
        cursor:pointer;
        font-weight:700;
        font-size:13px;
        transition:.25s cubic-bezier(0.34,1.56,0.64,1);
    }

    .btn:hover{opacity:0.9;}
    .btn:active{transform:scale(0.95);}
    .btn.danger{background:var(--red);}

    .input{
        width:100%;
        padding:14px 16px;
        margin:8px 0;
        border-radius:14px;
        border:1.5px solid var(--border);
        background:#050505;
        color:white;
        font-size:15px;
        font-weight:600;
        transition:.25s;
    }

    .input:focus{
        border-color:var(--accent);
        background:#080d18;
    }

    .popup{
        position:fixed;
        top:-100px;
        left:50%;
        transform:translateX(-50%);
        background:var(--accent);
        color:white;
        padding:14px 22px;
        border-radius:22px;
        font-weight:700;
        display:none;
        z-index:99999;
        transition:.4s cubic-bezier(.175,.885,.32,1.275);
        box-shadow:0 18px 35px rgba(0,102,255,.4);
    }

    .popup.show{top:calc(25px + env(safe-area-inset-top));}
    .popup.error{background:var(--red);}

    #loginSection{
        text-align:center;
        margin-top:50px;
    }

    /* TOKEN LIST WITH SEARCH */
    .token-search-wrap{
        position:relative;
        margin-bottom:16px;
    }

    .token-search-wrap i{
        position:absolute;
        left:16px;
        top:50%;
        transform:translateY(-50%);
        color:#666;
        font-size:14px;
    }

    .token-search{
        width:100%;
        background:#050505;
        border:1.5px solid var(--border);
        border-radius:14px;
        padding:14px 16px 14px 44px;
        color:white;
        font-size:15px;
        font-weight:600;
        outline:none;
        transition:.25s;
    }

    .token-search:focus{
        border-color:var(--accent);
        box-shadow:0 0 12px rgba(0,102,255,0.3);
    }

    .token-item{
        background:#050505;
        border:1.5px solid var(--border);
        border-radius:18px;
        padding:16px;
        margin-bottom:12px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:12px;
    }

    .token-info{
        display:flex;
        align-items:center;
        gap:12px;
        flex:1;
    }

    .token-logo{
        width:44px;
        height:44px;
        border-radius:12px;
        background:#000;
        border:1.5px solid var(--border);
    }

    .token-details h4{
        margin:0 0 4px 0;
        font-size:16px;
        font-weight:800;
    }

    .token-details p{
        margin:0;
        font-size:13px;
        color:var(--muted);
    }

    .token-actions{
        display:flex;
        flex-direction:column;
        align-items:flex-end;
        gap:8px;
    }

    .holder-count{
        background:rgba(0,102,255,0.12);
        color:var(--accent);
        padding:6px 12px;
        border-radius:999px;
        font-size:12px;
        font-weight:800;
        display:flex;
        align-items:center;
        gap:6px;
        animation:holderPulse 2s ease-in-out infinite;
    }

    @keyframes holderPulse{
        0%,100%{box-shadow:0 0 0 0 rgba(0,102,255,0.4);}
        50%{box-shadow:0 0 0 6px rgba(0,102,255,0);}
    }

    .token-update-row{
        display:flex;
        gap:8px;
        margin-top:8px;
    }

    .token-update-row input{
        flex:1;
        padding:10px 12px;
        margin:0;
    }

    /* FLOATING SEARCH BUTTON */
    .fab-search{
        position:fixed;
        bottom:calc(24px + env(safe-area-inset-bottom));
        right:24px;
        width:56px;
        height:56px;
        background:var(--accent);
        border:none;
        border-radius:18px;
        color:white;
        font-size:20px;
        display:none;
        justify-content:center;
        align-items:center;
        cursor:pointer;
        box-shadow:0 12px 30px rgba(0,102,255,0.4);
        z-index:100;
        transition:.3s cubic-bezier(0.34,1.56,0.64,1);
    }

    .fab-search:active{transform:scale(0.9);}

    .fab-search.show{display:flex;}

    @keyframes fadeIn{
        from{opacity:0;transform:translateY(12px);}
        to{opacity:1;transform:translateY(0);}
    }

    .empty-state{
        text-align:center;
        padding:60px 20px;
        color:var(--muted);
    }

    .empty-state i{
        font-size:48px;
        margin-bottom:16px;
        opacity:0.3;
    }
  </style>
</head>
<body>

<div class="market-background">
    <div class="candle-container c1"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c2"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c3"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c4"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c5"><div class="wick"></div><div class="real-body"></div></div>
</div>

<div class="popup" id="popup"></div>

<div class="app-container">

    <div class="top-header-row">
        <div class="left-actions-group">
            <div class="back-btn" onclick="window.location.href='index.html'">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
        </div>
        <div class="brand-logo-center">AirBy<span class="accent-tick">'</span></div>
        <div class="right-actions-group"></div>
    </div>

    <div id="loginSection">
        <h2 style="color:var(--accent);margin-bottom:20px;">Admin Login</h2>
        <input type="email" id="loginEmail" class="input" placeholder="Admin Email">
        <input type="password" id="loginPassword" class="input" placeholder="Password">
        <button class="btn" onclick="loginAdmin()" style="width:100%;margin-top:10px;">Login</button>
    </div>

    <div class="container" id="adminPanel" style="display:none;">
        
        <!-- MAIN TABS: WITHDRAWALS | CREATE TOKEN | UPDATE PRICES -->
        <div class="main-tabs" style="display:flex;gap:10px;margin-bottom:24px;background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:6px;">
            <button class="main-tab-btn active" id="withdrawalsTab" onclick="switchMainTab('withdrawals')">
                <i class="fa-solid fa-money-bill-transfer"></i> Withdrawals
            </button>
            <button class="main-tab-btn" id="createTokenTab" onclick="switchMainTab('createToken')">
                <i class="fa-solid fa-coins"></i> Create Token
            </button>
            <button class="main-tab-btn" id="updatePricesTab" onclick="switchMainTab('updatePrices')">
                <i class="fa-solid fa-chart-line"></i> Update Prices
            </button>
            
          <button class="main-tab-btn" onclick="window.location.href='maintain-control.html'">
    <i class="fa-solid fa-screwdriver-wrench"></i> Maintenance
</button>
        </div>

        <!-- TAB 1: WITHDRAWAL ORDERS ONLY -->
        <div class="tab-content active" id="withdrawalsContent">
            <div class="section">
                <h2>Pending Withdrawals</h2>
                <div id="withdrawalsList">Loading withdrawals...</div>
            </div>
        </div>

        <!-- TAB 2: TOKEN CREATION -->
        <div class="tab-content" id="createTokenContent">
            <div class="section">
                <h2>Launch New Token</h2>
                <input type="text" id="tokenName" class="input" placeholder="Token Name">
                <input type="text" id="tokenSymbol" class="input" placeholder="Symbol (e.g., ZZC)">
                <input type="number" id="tokenPrice" class="input" placeholder="Current Price (₦)">
                <input type="file" id="tokenLogoFile" accept="image/*" class="input">
                <button class="btn" onclick="launchToken()" style="width:100%;margin-top:8px;">🚀 Launch Token</button>
            </div>
        </div>

        <!-- TAB 3: TOKEN PRICE UPDATE WITH SEARCH -->
        <div class="tab-content" id="updatePricesContent">
            <div class="section">
                <h2>Token Price Updates</h2>
                <div id="tokenList">Loading tokens...</div>
            </div>
        </div>

    </div>
</div>

<!-- FLOATING SEARCH FAB - Only shows on Price Update tab -->
<button class="fab-search" id="fabSearch" onclick="toggleTokenSearch()">
    <i class="fa-solid fa-magnifying-glass"></i>
</button>

<script>
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentMainTab = "withdrawals";
let withdrawals = [];
let allTokens = [];
let tokenHolders = {};

function showPopup(message, isError = false) {
    const popup = document.getElementById('popup');
    popup.textContent = message;
    popup.className = isError ? 'popup error show' : 'popup show';
    setTimeout(() => popup.classList.remove('show'), 3000);
}

// ADMIN LOGIN
async function loginAdmin() {
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) return showPopup("Login failed. Check credentials.", true);
    
    const user = data.user;
    const { data: adminCheck } = await supabaseClient
        .from('users')
        .select('is_admin')
        .eq('auth_id', user.id)
        .single();
    
    if (!adminCheck || adminCheck.is_admin !== true) {
        showPopup("Access Denied. Not an admin account.", true);
        await supabaseClient.auth.signOut();
        return;
    }
    
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadWithdrawals();
    loadTokens();
    initializeRealtime();
    showPopup("Welcome, Admin!");
}

// MAIN TAB SWITCHING
function switchMainTab(tab) {
    currentMainTab = tab;
    document.querySelectorAll('.main-tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    document.getElementById(tab + 'Tab').classList.add('active');
    document.getElementById(tab + 'Content').classList.add('active');
    
    // Show FAB only on price update tab
    const fab = document.getElementById('fabSearch');
    if (tab === 'updatePrices') {
        fab.classList.add('show');
    } else {
        fab.classList.remove('show');
    }
}

// LOAD WITHDRAWALS ONLY - NO DEPOSITS
async function loadWithdrawals() {
    const { data: withdrawalsData, error } = await supabaseClient
        .from('withdrawals')
        .select('*')
        .eq('status', 'pending')
        .order('created_at', { ascending: false });
    
    if (error) {
        console.log(error);
        showPopup("Failed to load withdrawals", true);
        return;
    }
    
    withdrawals = withdrawalsData || [];
    renderWithdrawals();
}

function renderWithdrawals() {
    const div = document.getElementById('withdrawalsList');
    div.innerHTML = '';
    
    if (!withdrawals.length) {
        div.innerHTML = '<div class="empty-state"><i class="fa-solid fa-inbox"></i><p>No pending withdrawals</p></div>';
        return;
    }
    
    withdrawals.forEach(wd => {
        const el = document.createElement('div');
        el.className = 'order';
        el.innerHTML = `
            <div class="order-header">
                <span class="order-type" style="color:var(--red)">Withdrawal Request</span>
                <span class="order-amount withdraw">-₦${Number(wd.amount).toLocaleString()}</span>
            </div>
            <span>Email: ${wd.email}</span>
            <span>Bank: ${wd.bank_name}</span>
            <span>Account: ${wd.account_number}</span>
            <span>Name: ${wd.account_name}</span>
            <span style="font-size:12px;color:var(--muted)">${new Date(wd.created_at).toLocaleString()}</span>
            <div style="margin-top:10px;">
                <button class="btn" onclick="approveWithdraw(${wd.id})">Approve</button>
                <button class="btn danger" onclick="rejectWithdraw(${wd.id}, '${wd.email}', ${wd.amount})">Reject</button>
            </div>
        `;
        div.appendChild(el);
    });
}

// APPROVE WITHDRAW - Check RLS policy allows this
async function approveWithdraw(id) {
    const { error } = await supabaseClient.from('withdrawals').update({ status: 'approved' }).eq('id', id);
    if (error) {
        console.log(error);
        showPopup('Approve failed. Check database permissions.', true);
        return;
    }
    showPopup('Withdraw Approved!');
    loadWithdrawals();
}

// REJECT WITHDRAW - REFUND
async function rejectWithdraw(id, email, amount) {
    const refundAmount = parseFloat(amount);
    
    // Get user balance first
    const { data: userData, error: userError } = await supabaseClient
        .from('users')
        .select('balance')
        .eq('email', email.toLowerCase())
        .single();
    
    if (userError || !userData) {
        showPopup("User not found!", true);
        return;
    }
    
    const newBalance = (parseFloat(userData.balance) || 0) + refundAmount;
    
    // Update balance
    const { error: updateError } = await supabaseClient
        .from('users')
        .update({ balance: newBalance })
        .eq('email', email.toLowerCase());
    
    if (updateError) {
        console.log(updateError);
        showPopup("Refund failed. Check permissions.", true);
        return;
    }
    
    // Update withdrawal status
    await supabaseClient.from('withdrawals').update({ status: 'rejected' }).eq('id', id);
    showPopup(`₦${refundAmount.toLocaleString()} refunded successfully.`);
    loadWithdrawals();
}

// LAUNCH TOKEN
async function launchToken() {
    const name = document.getElementById('tokenName').value.trim();
    const symbol = document.getElementById('tokenSymbol').value.trim();
    const price = parseFloat(document.getElementById('tokenPrice').value);
    const file = document.getElementById('tokenLogoFile').files[0];
    if (!name || !symbol || !price || !file) return showPopup("Fill all fields!", true);
    
    const filePath = `token_logos/${Date.now()}_${file.name}`;
    const { error: uploadError } = await supabaseClient.storage.from('proofs').upload(filePath, file);
    if (uploadError) return showPopup("Logo upload failed!", true);
    
    const { data: publicUrlData } = supabaseClient.storage.from('proofs').getPublicUrl(filePath);
    const logoUrl = publicUrlData.publicUrl;
    
    const { error: insertError } = await supabaseClient.from('tokens').insert({
        name, symbol, logo_url: logoUrl, current_price: price, status: 'active', created_at: new Date()
    });
    
    if (insertError) return showPopup("Error launching token!", true);
    showPopup("Token launched!");
    document.getElementById('tokenName').value = '';
    document.getElementById('tokenSymbol').value = '';
    document.getElementById('tokenPrice').value = '';
    document.getElementById('tokenLogoFile').value = '';
    loadTokens();
}

// LOAD TOKENS WITH HOLDER COUNT
async function loadTokens() {
    const { data: tokens } = await supabaseClient.from('tokens').select('*').order('created_at', { ascending: false });
    allTokens = tokens || [];
    
    // Get holder counts for each token
    const { data: userTokens } = await supabaseClient.from('user_token').select('token_id');
    tokenHolders = {};
    userTokens?.forEach(ut => {
        tokenHolders[ut.token_id] = (tokenHolders[ut.token_id] || 0) + 1;
    });
    
    renderTokenList(allTokens);
}

function renderTokenList(tokens) {
    const div = document.getElementById('tokenList');
    div.innerHTML = '';
    
    if (!tokens || tokens.length === 0) {
        div.innerHTML = '<div class="empty-state"><i class="fa-solid fa-coins"></i><p>No tokens launched yet.</p></div>';
        return;
    }
    
    tokens.forEach(tk => {
        const holderCount = tokenHolders[tk.id] || 0;
        const el = document.createElement('div');
        el.className = 'token-item';
        el.innerHTML = `
            <div class="token-info">
                <img src="${tk.logo_url}" class="token-logo" alt="${tk.symbol}">
                <div class="token-details">
                    <h4>${tk.name} (${tk.symbol})</h4>
                    <p>Current Price: ₦${tk.current_price}</p>
                </div>
            <div class="token-actions">
                <div class="holder-count">
                    <i class="fa-solid fa-users"></i> ${holderCount}
                </div>
            </div>
        `;
        
        const updateDiv = document.createElement('div');
        updateDiv.className = 'token-update-row';
        updateDiv.innerHTML = `
            <input type="number" class="input" id="price_${tk.id}" placeholder="New Price (₦)" style="margin:0;">
            <button class="btn" onclick="updatePrice(${tk.id})" style="margin:0;padding:10px 16px;">Update</button>
        `;
        
        const wrapper = document.createElement('div');
        wrapper.appendChild(el);
        wrapper.appendChild(updateDiv);
        div.appendChild(wrapper);
    });
}

// FLOATING SEARCH TOGGLE
let searchVisible = false;
function toggleTokenSearch() {
    const searchWrap = document.querySelector('.token-search-wrap');
    if (!searchWrap) return;
    searchVisible = !searchWrap;
    searchWrap.style.display = searchVisible ? 'block' : 'none';
    if (searchVisible) document.getElementById('tokenSearch').focus();
}

// TOKEN SEARCH
document.getElementById('tokenSearch')?.addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    const filtered = allTokens.filter(tk => 
        tk.name.toLowerCase().includes(query) || 
        tk.symbol.toLowerCase().includes(query)
    );
    renderTokenList(filtered);
});

// UPDATE TOKEN PRICE
async function updatePrice(id) {
    const newPrice = parseFloat(document.getElementById(`price_${id}`).value);
    if (!newPrice) return showPopup('Enter valid price!', true);
    await supabaseClient.from('tokens').update({ current_price: newPrice }).eq('id', id);
    showPopup('Price updated!');
    loadTokens();
}

// REALTIME UPDATES
function initializeRealtime() {
    supabaseClient
        .channel('admin-realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'withdrawals' }, () => loadWithdrawals())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'user_token' }, () => loadTokens())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tokens' }, () => loadTokens())
        .subscribe();
}

window.addEventListener('DOMContentLoaded', () => {
    const adminCheck = localStorage.getItem('is_admin');
    if (!adminCheck) {
        document.getElementById('loginSection').style.display = 'block';
    } else {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadWithdrawals();
        loadTokens();
        initializeRealtime();
    }
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js');
  });
}
</script>
