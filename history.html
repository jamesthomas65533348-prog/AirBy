<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>Transaction History - AirBy'</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>

<style>

:root{
    --accent:#0066ff;
    --bg:#000000;
    --card:#0b0b0c;
    --border:#1c1c1e;
    --text:#ffffff;
    --muted:#7d7d7d;
    --green:#00d26a;
    --orange:#ff9500;
    --red:#ff3b30;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
}

/* BACKGROUND */

.market-background{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    opacity:.12;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:0 10px;
    pointer-events:none;
}

.candle-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:12px;
    position:relative;
}

.wick{
    width:2px;
    height:120px;
    background-color:#34c759;
}

.real-body{
    width:14px;
    height:50px;
    background-color:#34c759;
    border-radius:3px;
    position:absolute;
    animation:marketFluctuation 4s ease-in-out infinite alternate;
}

.c1 .real-body{
    animation-delay:0s;
    height:60px;
}

.c2 .real-body{
    animation-delay:.8s;
    height:40px;
}

.c3 .real-body{
    animation-delay:1.5s;
    height:75px;
}

.c4 .real-body{
    animation-delay:.3s;
    height:35px;
}

.c5 .real-body{
    animation-delay:2.1s;
    height:55px;
}

@keyframes marketFluctuation{
    0%{
        transform:translateY(-15px);
    }
    100%{
        transform:translateY(15px);
    }
}

/* APP */

.app-container{
    width:100%;
    max-width:414px;
    margin:auto;
    min-height:100vh;
    padding:24px;
    position:relative;
    z-index:5;
}

/* HEADER */

.top-header-row{
    width:100%;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding-top:10px;
    margin-bottom:28px;
}

.brand-logo-center{
    font-size:26px;
    font-weight:800;
    letter-spacing:-1px;
    color:#ffffff;
    text-align:center;
    grid-column:2;
}

.brand-logo-center .accent-tick{
    color:var(--accent);
}

.left-actions-group,
.right-actions-group{
    display:flex;
    align-items:center;
}

.left-actions-group{
    justify-content:flex-start;
}

.right-actions-group{
    justify-content:flex-end;
}

.back-btn{
    width:44px;
    height:44px;
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.2s;
    cursor:pointer;
}

.back-btn:active{
    transform:scale(.92);
}

.back-btn i{
    color:white;
    font-size:16px;
}

/* PAGE */

.page-title{
    font-size:32px;
    font-weight:800;
    letter-spacing:-1px;
    margin-bottom:6px;
}

.page-subtitle{
    color:var(--muted);
    font-size:14px;
    margin-bottom:26px;
    line-height:1.5;
}

/* TABS */

.tabs{
    display:flex;
    gap:12px;
    margin-bottom:24px;
}

.tab-btn{
    flex:1;
    border:none;
    background:#0b0b0c;
    border:1.5px solid var(--border);
    color:#ffffff;
    border-radius:18px;
    padding:16px 14px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:.25s;
}

.tab-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    box-shadow:0 10px 25px rgba(0,102,255,.25);
}

.tab-btn:active{
    transform:scale(.97);
}

/* LIST */

.transactions-container{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.transaction-card{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:24px;
    padding:18px;
    animation:fadeIn .35s ease;
    box-shadow:0 10px 25px rgba(0,0,0,.4);
}

.transaction-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

.transaction-left{
    display:flex;
    align-items:center;
    gap:14px;
}

.transaction-icon{
    width:52px;
    height:52px;
    border-radius:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    flex-shrink:0;
}

.deposit-icon{
    background:rgba(0,210,106,.12);
    color:var(--green);
}

.withdraw-icon{
    background:rgba(255,59,48,.12);
    color:var(--red);
}

.transaction-type{
    font-size:16px;
    font-weight:800;
    margin-bottom:4px;
}

.transaction-date{
    color:var(--muted);
    font-size:12px;
}

.amount{
    font-size:20px;
    font-weight:800;
    letter-spacing:-.5px;
}

.amount.deposit{
    color:var(--green);
}

.amount.withdraw{
    color:var(--red);
}

.details-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:8px;
}

.detail-box{
    background:#050505;
    border:1px solid var(--border);
    border-radius:16px;
    padding:12px;
}

.detail-label{
    color:#777;
    font-size:11px;
    margin-bottom:6px;
    text-transform:uppercase;
    font-weight:700;
}

.detail-value{
    font-size:14px;
    font-weight:700;
    word-break:break-word;
}

/* STATUS */

.status-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:800;
    margin-top:16px;
    width:fit-content;
}

.status-dot{
    width:10px;
    height:10px;
    border-radius:50%;
}

.status-approved{
    background:rgba(0,210,106,.12);
    color:var(--green);
}

.status-approved .status-dot{
    background:var(--green);
    box-shadow:0 0 12px var(--green);
}

.status-pending{
    background:rgba(255,149,0,.12);
    color:var(--orange);
}

.status-pending .status-dot{
    background:var(--orange);
    box-shadow:0 0 12px var(--orange);
}

.status-rejected,
.status-failed{
    background:rgba(255,59,48,.12);
    color:var(--red);
}

.status-rejected .status-dot,
.status-failed .status-dot{
    background:var(--red);
    box-shadow:0 0 12px var(--red);
}

/* EMPTY */

.empty-state{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:26px;
    padding:40px 20px;
    text-align:center;
}

.empty-state i{
    font-size:42px;
    color:#333;
    margin-bottom:16px;
}

.empty-state h3{
    font-size:20px;
    margin-bottom:8px;
}

.empty-state p{
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
}

/* TOAST */

#toast{
    position:fixed;
    top:-100px;
    left:50%;
    transform:translateX(-50%);
    padding:14px 22px;
    border-radius:22px;
    font-size:14px;
    font-weight:700;
    color:white;
    background:#111;
    border:1px solid rgba(255,255,255,.08);
    z-index:99999;
    transition:.35s;
    box-shadow:0 18px 35px rgba(0,0,0,.5);
}

#toast.show{
    top:25px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

</head>

<body>

<div class="market-background">

    <div class="candle-container c1">
        <div class="wick"></div>
        <div class="real-body"></div>
    </div>

    <div class="candle-container c2">
        <div class="wick"></div>
        <div class="real-body"></div>
    </div>

    <div class="candle-container c3">
        <div class="wick"></div>
        <div class="real-body"></div>
    </div>

    <div class="candle-container c4">
        <div class="wick"></div>
        <div class="real-body"></div>
    </div>

    <div class="candle-container c5">
        <div class="wick"></div>
        <div class="real-body"></div>
    </div>

</div>

<div id="toast"></div>

<div class="app-container">

    <div class="top-header-row">

        <div class="left-actions-group">

            <div
            class="back-btn"
            onclick="window.location.href='index.html'">

                <i class="fa-solid fa-arrow-left"></i>

            </div>

        </div>

        <div class="brand-logo-center">
            AirBy<span class="accent-tick">'</span>
        </div>

        <div class="right-actions-group"></div>

    </div>

    <div class="page-title">
        Transaction History
    </div>

    <div class="page-subtitle">
        Track all your deposits and withdrawal transactions in real time.
    </div>

    <div class="tabs">

        <button
        class="tab-btn active"
        id="depositTab"
        onclick="switchTab('deposit')">

            Deposits

        </button>

        <button
        class="tab-btn"
        id="withdrawTab"
        onclick="switchTab('withdraw')">

            Withdrawals

        </button>

    </div>

    <div
    class="transactions-container"
    id="transactionsContainer">

        <!-- Transactions Here -->

    </div>

</div>

<script>

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

const userEmail =
localStorage.getItem("user_email");

let currentTab = "deposit";

let deposits = [];

let withdrawals = [];

function showToast(message){

    const toast =
    document.getElementById("toast");

    toast.innerText = message;

    toast.classList.add("show");

    setTimeout(()=>{

        toast.classList.remove("show");

    },3000);
}

function formatDate(date){

    return new Date(date)
    .toLocaleString("en-NG",{
        day:"numeric",
        month:"short",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit"
    });
}

function getStatusClass(status){

    status =
    (status || "").toLowerCase();

    if(status === "approved" || status === "success"){
        return "status-approved";
    }

    if(status === "pending"){
        return "status-pending";
    }

    return "status-rejected";
}

function switchTab(tab){

    currentTab = tab;

    document
    .getElementById("depositTab")
    .classList.remove("active");

    document
    .getElementById("withdrawTab")
    .classList.remove("active");

    if(tab === "deposit"){

        document
        .getElementById("depositTab")
        .classList.add("active");

    }else{

        document
        .getElementById("withdrawTab")
        .classList.add("active");
    }

    renderTransactions();
}

function renderTransactions(){

    const container =
    document.getElementById(
        "transactionsContainer"
    );

    container.innerHTML = "";

    const data =
    currentTab === "deposit"
    ? deposits
    : withdrawals;

    if(!data.length){

        container.innerHTML = `

        <div class="empty-state">

            <i class="fa-solid fa-clock-rotate-left"></i>

            <h3>
                No Transactions Yet
            </h3>

            <p>
                Your ${currentTab} history will appear here once available.
            </p>

        </div>

        `;

        return;
    }

    data.forEach(item=>{

        const card =
        document.createElement("div");

        card.className =
        "transaction-card";

        const isDeposit =
        currentTab === "deposit";

        const status =
        item.status || "pending";

        card.innerHTML = `

        <div class="transaction-top">

            <div class="transaction-left">

                <div class="transaction-icon ${isDeposit ? "deposit-icon" : "withdraw-icon"}">

                    <i class="fa-solid ${isDeposit ? "fa-arrow-down" : "fa-arrow-up"}"></i>

                </div>

                <div>

                    <div class="transaction-type">

                        ${isDeposit ? "Wallet Deposit" : "Bank Withdrawal"}

                    </div>

                    <div class="transaction-date">

                        ${formatDate(item.created_at)}

                    </div>

                </div>

            </div>

            <div class="amount ${isDeposit ? "deposit" : "withdraw"}">

                ${isDeposit ? "+" : "-"}₦${Number(item.amount || 0).toLocaleString()}

            </div>

        </div>

        ${
            isDeposit
            ?

            `

            <div class="details-grid">

                <div class="detail-box">

                    <div class="detail-label">
                        Reference
                    </div>

                    <div class="detail-value">
                        ${item.tx_ref || "N/A"}
                    </div>

                </div>

                <div class="detail-box">

                    <div class="detail-label">
                        Payment
                    </div>

                    <div class="detail-value">
                        Flutterwave
                    </div>

                </div>

            </div>

            `

            :

            `

            <div class="details-grid">

                <div class="detail-box">

                    <div class="detail-label">
                        Bank
                    </div>

                    <div class="detail-value">
                        ${item.bank_name || "N/A"}
                    </div>

                </div>

                <div class="detail-box">

                    <div class="detail-label">
                        Account
                    </div>

                    <div class="detail-value">
                        ${item.account_number || "N/A"}
                    </div>

                </div>

            </div>

            `
        }

        <div class="status-badge ${getStatusClass(status)}">

            <div class="status-dot"></div>

            ${String(status).toUpperCase()}

        </div>

        `;

        container.appendChild(card);

    });
}

async function loadHistory(){

    try{

        if(!userEmail){

            showToast("Login required");

            setTimeout(()=>{

                location.href =
                "login.html";

            },1200);

            return;
        }

        const {
            data:depositData,
            error:depositError
        } =
        await supabaseClient
        .from("deposits")
        .select("*")
        .eq(
            "email",
            userEmail.toLowerCase()
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );

        if(depositError){

            console.log(depositError);

        }else{

            deposits =
            depositData || [];
        }

        const {
            data:withdrawData,
            error:withdrawError
        } =
        await supabaseClient
        .from("withdrawals")
        .select("*")
        .eq(
            "email",
            userEmail.toLowerCase()
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );

        if(withdrawError){

            console.log(withdrawError);

        }else{

            withdrawals =
            withdrawData || [];
        }

        renderTransactions();

    }catch(err){

        console.log(err);

        showToast(
            "Failed to load history"
        );
    }
}

function initializeRealtime(){

    supabaseClient

    .channel("history-realtime")

    .on(
        "postgres_changes",
        {
            event:"*",
            schema:"public",
            table:"deposits",
            filter:`email=eq.${userEmail.toLowerCase()}`
        },

        payload=>{

            const newData =
            payload.new;

            if(!newData) return;

            const existingIndex =
            deposits.findIndex(
                item=>item.id === newData.id
            );

            if(existingIndex >= 0){

                deposits[existingIndex] =
                newData;

            }else{

                deposits.unshift(newData);
            }

            renderTransactions();

            showToast(
                `Deposit ${newData.status || "updated"}`
            );
        }
    )

    .on(
        "postgres_changes",
        {
            event:"*",
            schema:"public",
            table:"withdrawals",
            filter:`email=eq.${userEmail.toLowerCase()}`
        },

        payload=>{

            const newData =
            payload.new;

            if(!newData) return;

            const existingIndex =
            withdrawals.findIndex(
                item=>item.id === newData.id
            );

            if(existingIndex >= 0){

                withdrawals[existingIndex] =
                newData;

            }else{

                withdrawals.unshift(newData);
            }

            renderTransactions();

            showToast(
                `Withdrawal ${newData.status || "updated"}`
            );
        }
    )

    .subscribe();
}

window.addEventListener(
    "DOMContentLoaded",
    ()=>{

        loadHistory();

        initializeRealtime();

    }
);

</script>

</body>
</html>
