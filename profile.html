<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AirBy - Account Profile</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0066ff">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* Premium AirBy AMOLED Clean UI Settings */
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Animated Green Crypto Candlestick Background Canvas Layer */
    .market-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.12;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
      pointer-events: none;
    }

    .candle-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 12px;
      position: relative;
    }

    .wick {
      width: 2px;
      height: 120px;
      background-color: #34c759;
    }

    .real-body {
      width: 14px;
      height: 50px;
      background-color: #34c759;
      border-radius: 3px;
      position: absolute;
      animation: marketFluctuation 4s ease-in-out infinite alternate;
    }

    .c1 .real-body { animation-delay: 0s; height: 60px; }
    .c2 .real-body { animation-delay: 0.8s; height: 40px; }
    .c3 .real-body { animation-delay: 1.5s; height: 75px; }

    @keyframes marketFluctuation {
      0% { transform: translateY(-15px); }
      100% { transform: translateY(15px); }
    }

    /* Core Interface Wrapper Box */
    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      position: relative;
      z-index: 10;
    }

    /* Top Navigation Row */
    .top-header-row{
    width:100%;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding-top:10px;
    margin-bottom:24px;
}

.brand-logo-center{
    font-size:22px;
    font-weight:800;
    letter-spacing:-1px;
    color:#ffffff;
    text-align:center;
    grid-column:2;
}

.brand-logo-center .accent-tick{color:var(--accent);}

.left-actions-group,.right-actions-group{
    display:flex;
    align-items:center;
}

.left-actions-group{
    justify-content:flex-start;
    grid-column:1;
}

.right-actions-group{
    justify-content:flex-end;  /* This pushes the gear to the edge */
    grid-column:3;
}

.back-nav-trigger {
    width: 44px;
    height: 44px;
    background: #0b0b0c;
    border: 1.5px solid #1c1c1e;
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.back-nav-trigger svg {
    width: 20px;
    height: 20px;
    stroke: #ffffff;
    stroke-width: 2.5;
    fill: none;
}

.back-nav-trigger:active {
    transform: scale(0.9);
}

.back-btn{
    width:44px;
    height:44px;
    background:#0b0b0c;
    border:1.5px solid #1c1c1e;
    border-radius:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.2s cubic-bezier(0.34,1.56,0.64,1);
    cursor:pointer;
}

.back-btn:active{transform:scale(.92);}
.back-btn i{color:white;font-size:16px;}

    /* Account Header Detail Row with Avatar Upgrades */
    .profile-hero-card {
      text-align: center;
      margin-bottom: 24px;
    }

    .avatar-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 12px auto;
    }

    .profile-avatar-shield {
      width: 80px;
      height: 80px;
      border: 2px solid #0066ff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #1c1c1e;
      box-shadow: 0 8px 24px rgba(0, 102, 255, 0.2);
    }

    .profile-avatar-shield svg {
      width: 100%;
      height: 100%;
    }

    .camera-badge-trigger {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 28px;
      height: 28px;
      background: #0066ff;
      border: 2px solid #000000;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .camera-badge-trigger svg {
      width: 14px;
      height: 14px;
      stroke: #ffffff;
      stroke-width: 2.5;
      fill: none;
    }

    .profile-hero-card h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .profile-hero-card span {
      font-size: 14px;
      color: #34c759;
      font-weight: 600;
    }

    /* Core Form Content Field Settings */
    .profile-fields-scroller {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-wrapper-node {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-wrapper-node label {
      font-size: 12px;
      font-weight: 700;
      color: #666666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding-left: 4px;
    }

    .field-container {
      width: 100%;
      background: #0b0b0c;
      border: 1.5px solid #1c1c1e;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      color: #aeaeb2;
      font-size: 15px;
      font-weight: 600;
    }

    /* Locked unchangeable native attributes layout styling matching your exact preference */
    .field-container.locked-state {
      background: rgba(11, 11, 12, 0.4);
      border-color: rgba(28, 28, 30, 0.5);
      color: #555555;
      cursor: not-allowed;
    }

    /* Editable Field Customizations */
    .field-container input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      padding: 0;
      -webkit-user-select: text;
      user-select: text;
    }

    .field-container input::placeholder {
      color: #3a3a3c;
    }

    /* Spring Action Control Button System Layout */
    .action-button-container {
      margin-top: auto;
      padding-bottom: 10px;
      width: 100%;
      height: 60px;
    }

    .save-profile-btn {
      width: 100%;
      padding: 16px;
      background: #0066ff;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-weight: 700;
      font-size: 15px;
      text-align: center;
      cursor: pointer;
      display: none;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .save-profile-btn.reveal {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .save-profile-btn:active {
      transform: scale(0.95);
    }

    /* Premium Built-In System Album Overlay Draw Panel */
    .album-drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .album-drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .album-drawer-sheet {
      width: 100%;
      max-width: 414px;
      background: #0b0b0c;
      border-top: 1.5px solid #1c1c1e;
      border-radius: 28px 28px 0 0;
      padding: 24px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
    }

    .album-drawer-overlay.active .album-drawer-sheet {
      transform: translateY(0);
    }

    .album-drawer-sheet h3 {
      margin: 0 0 4px 0;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
    }

    .album-drawer-sheet p {
      margin: 0 0 20px 0;
      font-size: 13px;
      color: #666666;
      text-align: center;
      font-weight: 600;
    }

    .avatar-grid-layout {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .avatar-option-node {
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #1c1c1e;
      background: #111;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .avatar-option-node.selected {
      border-color: #0066ff;
      transform: scale(1.08);
    }

    .avatar-option-node svg {
      width: 100%;
      height: 100%;
    }

    .close-drawer-btn {
      width: 100%;
      padding: 14px;
      background: #1c1c1e;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    /* System Adaptive Response Toast Block */
    .airby-toast {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      background: #ff3b30;
      color: #ffffff;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0px 16px 32px rgba(0, 0, 0, 0.8);
      z-index: 10005;
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
    }

    .airby-toast.reveal {
      top: 24px;
    }
    
    .airby-toast.success-theme {
      background: #34c759;
    }
  </style>
</head>
<body>

  <div class="market-background">
    <div class="candle-container c1"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c2"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c3"><div class="wick"></div><div class="real-body"></div></div>
  </div>

  <div class="app-container">
    
    <div class="top-header-row">
  <div class="back-nav-trigger" onclick="window.location.href = 'index.html'">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </div>
  <div class="brand-logo-center">Profile</div>
  <div class="right-actions-group">
    <div class="back-btn" onclick="window.location.href='settings.html'" title="Settings">
      <i class="fa-solid fa-gear"></i>
    </div>
  </div>
</div>

    <div class="profile-hero-card">
      <div class="avatar-wrapper">
        <div class="profile-avatar-shield" id="display_avatar_container">
          <svg viewBox="0 0 100 100"><defs><linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1c1c1e"/><stop offset="100%" stop-color="#0b0b0c"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#g1)"/><circle cx="50" cy="40" r="18" fill="#555"/><path d="M22 82c0-15 12-25 28-25s28 10 28 25z" fill="#555"/></svg>
        </div>
        <div class="camera-badge-trigger" onclick="toggleAvatarDrawer(true)">
          <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        </div>
      </div>
      <h2 id="hero_nickname">Trader</h2>
      <span id="hero_balance_display">₦0</span>
    </div>

    <div class="profile-fields-scroller">
      
      <div class="input-wrapper-node">
        <label>Account Email</label>
        <div class="field-container locked-state" id="email_field">---</div>
      </div>

      <div class="input-wrapper-node">
        <label>First Name</label>
        <div class="field-container locked-state" id="first_name_field">---</div>
      </div>

      <div class="input-wrapper-node">
        <label>Last Name</label>
        <div class="field-container locked-state" id="last_name_field">---</div>
      </div>

      <div class="input-wrapper-node">
        <label>Personal Nickname</label>
        <div class="field-container">
          <input type="text" id="nickname_input" placeholder="Set your account nickname..." autocomplete="off" />
        </div>
      </div>

    </div>

    <div class="action-button-container">
      <button class="save-profile-btn" id="save_changes_trigger" onclick="commitProfileUpdate()">
        Save Changes
      </button>
    </div>

  </div>

  <div class="album-drawer-overlay" id="album_overlay" onclick="toggleAvatarDrawer(false)">
    <div class="album-drawer-sheet" onclick="event.stopPropagation()">
      <h3>Select Profile Avatar</h3>
      <p>Choose an avatar style from the system list</p>
      
      <div class="avatar-grid-layout" id="avatar_picker_grid">
        </div>

      <button class="close-drawer-btn" onclick="toggleAvatarDrawer(false)">Cancel</button>
    </div>
  </div>

  <div class="airby-toast" id="system_toast">Notification Alert Box</div>

  <script src="config.js"></script>
  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const userSessionEmail = localStorage.getItem("user_email");
    
    // Mutation Tracking Variables
    let currentFetchedNicknameValue = "";
    let currentFetchedAvatarId = "avatar1";
    let temporarySelectedAvatarId = "avatar1";

    // UI Nodes Connectors
    const heroNickname = document.getElementById("hero_nickname");
    const heroBalanceDisplay = document.getElementById("hero_balance_display");
    const emailField = document.getElementById("email_field");
    const firstNameField = document.getElementById("first_name_field");
    const lastNameField = document.getElementById("last_name_field");
    const nicknameInput = document.getElementById("nickname_input");
    const saveChangesTrigger = document.getElementById("save_changes_trigger");
    const displayAvatarContainer = document.getElementById("display_avatar_container");
    const avatarPickerGrid = document.getElementById("avatar_picker_grid");
    const albumOverlay = document.getElementById("album_overlay");

    // Pre-coded 12 Premium Built-In Lightweight Design Gradients
    const SVGA_ALBUM_COLLECTION = {
      avatar1:  `<svg viewBox="0 0 100 100"><defs><linearGradient id="av1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0066ff"/><stop offset="100%" stop-color="#002b80"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#av1)"/><circle cx="50" cy="42" r="16" fill="#fff" opacity="0.85"/><path d="M25 80c0-12 11-20 25-20s25 8 25 20z" fill="#fff" opacity="0.85"/></svg>`,
      avatar2:  `<svg viewBox="0 0 100 100"><defs><linearGradient id="av2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#34c759"/><stop offset="100%" stop-color="#0f521e"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#av2)"/><circle cx="50" cy="42" r="16" fill="#fff" opacity="0.85"/><path d="M25 80c0-12 11-20 25-20s25 8 25 20z" fill="#fff" opacity="0.85"/></svg>`,
      avatar3:  `<svg viewBox="0 0 100 100"><defs><linearGradient id="av3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff3b30"/><stop offset="100%" stop-color="#80110b"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#av3)"/><circle cx="50" cy="42" r="16" fill="#fff" opacity="0.85"/><path d="M25 80c0-12 11-20 25-20s25 8 25 20z" fill="#fff" opacity="0.85"/></svg>`,
      avatar4:  `<svg viewBox="0 0 100 100"><defs><linearGradient id="av4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#af52de"/><stop offset="100%" stop-color="#4c1a66"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#av4)"/><circle cx="50" cy="42" r="16" fill="#fff" opacity="0.85"/><path d="M25 80c0-12 11-20 25-20s25 8 25 20z" fill="#fff" opacity="0.85"/></svg>`,
      avatar5:  `<svg viewBox="0 0 100 100"><defs><linearGradient id="av5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff9500"/><stop offset="100%" stop-color="#804a00"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#av5)"/><circle cx="50" cy="42" r="16" fill="#fff" opacity="0.85"/><path d="M25 80c0-12 11-20 25-20s25 8 25 20z" fill="#fff" opacity="0.85"/></svg>`,
      avatar6:  `<svg viewBox="0 0 100 100"><defs><linearGradient id="av6" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#5ac8fa"/><stop offset="100%" stop-color="#16516c"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#av6)"/><circle cx="50" cy="42" r="16" fill="#fff" opacity="0.85"/><path d="M25 80c0-12 11-20 25-20s25 8 25 20z" fill="#fff" opacity="0.85"/></svg>`,
      avatar7:  `<svg viewBox="0 0 100 100"><defs><linearGradient id="av7" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffcc00"/><stop offset="100%" stop-color="#665200"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#av7)"/><circle cx="50" cy="42" r="16" fill="#fff" opacity="0.85"/><path d="M25 80c0-12 11-20 25-20s25 8 25 20z" fill="#fff" opacity="0.85"/></svg>`,
      avatar8:  `<svg viewBox="0 0 100 100"><defs><linearGradient id="av8" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1c1c1e"/><stop offset="100%" stop-color="#48484a"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#av8)"/><circle cx="50" cy="42" r="16" fill="#0066ff"/><path d="M25 80c0-12 11-20 25-20s25 8 25 20z" fill="#0066ff"/></svg>`,
      avatar9:  `<svg viewBox="0 0 100 100"><defs><linearGradient id="av9" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00ffff"/><stop offset="100%" stop-color="#005555"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#av9)"/><circle cx="50" cy="42" r="16" fill="#fff" opacity="0.85"/><path d="M25 80c0-12 11-20 25-20s25 8 25 20z" fill="#fff" opacity="0.85"/></svg>`,
      avatar10: `<svg viewBox="0 0 100 100"><defs><linearGradient id="av10" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff2d55"/><stop offset="100%" stop-color="#800c22"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#av10)"/><circle cx="50" cy="42" r="16" fill="#fff" opacity="0.85"/><path d="M25 80c0-12 11-20 25-20s25 8 25 20z" fill="#fff" opacity="0.85"/></svg>`,
      avatar11: `<svg viewBox="0 0 100 100"><defs><linearGradient id="av11" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4cd964"/><stop offset="100%" stop-color="#1e6e2b"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#av11)"/><circle cx="50" cy="42" r="16" fill="#fff" opacity="0.85"/><path d="M25 80c0-12 11-20 25-20s25 8 25 20z" fill="#fff" opacity="0.85"/></svg>`,
      avatar12: `<svg viewBox="0 0 100 100"><defs><linearGradient id="av12" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#e0e0e0"/><stop offset="100%" stop-color="#424242"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#av12)"/><circle cx="50" cy="42" r="16" fill="#111"/><path d="M25 80c0-12 11-20 25-20s25 8 25 20z" fill="#111"/></svg>`
    };

    function displayAdaptiveSystemToast(messageText, isSuccess = false) {
      const toast = document.getElementById("system_toast");
      toast.innerText = messageText;
      if (isSuccess) toast.classList.add("success-theme");
      else toast.classList.remove("success-theme");
      toast.classList.add("reveal");
      setTimeout(() => toast.classList.remove("reveal"), 3000);
    }

    function toggleAvatarDrawer(openState) {
      if (openState) {
        temporarySelectedAvatarId = currentFetchedAvatarId;
        renderAvatarSelectionGrid();
        albumOverlay.classList.add("active");
      } else {
        albumOverlay.classList.remove("active");
      }
    }

    function renderAvatarSelectionGrid() {
      avatarPickerGrid.innerHTML = "";
      Object.keys(SVGA_ALBUM_COLLECTION).forEach(key => {
        const itemNode = document.createElement("div");
        itemNode.className = `avatar-option-node ${key === temporarySelectedAvatarId ? 'selected' : ''}`;
        itemNode.innerHTML = SVGA_ALBUM_COLLECTION[key];
        itemNode.onclick = () => {
          temporarySelectedAvatarId = key;
          renderAvatarSelectionGrid();
          // Instantly preview selected option in real-time
          displayAvatarContainer.innerHTML = SVGA_ALBUM_COLLECTION[key];
          evaluateMutationState();
          toggleAvatarDrawer(false);
        };
        avatarPickerGrid.appendChild(itemNode);
      });
    }

    function evaluateMutationState() {
      const liveNicknameValue = nicknameInput.value.trim();
      const hasNicknameChanged = liveNicknameValue !== currentFetchedNicknameValue && liveNicknameValue.length > 0;
      const hasAvatarChanged = temporarySelectedAvatarId !== currentFetchedAvatarId;

      if (hasNicknameChanged || hasAvatarChanged) {
        saveChangesTrigger.classList.add("reveal");
      } else {
        saveChangesTrigger.classList.remove("reveal");
      }
    }

    async function loadAccountProfileParameters() {
      if (!userSessionEmail) {
        window.location.href = "login.html";
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('users')
          .select('balance, email, first_name, last_name, nickname, avatar_id')
          .eq('email', userSessionEmail.toLowerCase())
          .maybeSingle();

        if (error) throw error;

        if (data) {
          emailField.innerText = data.email;
          heroBalanceDisplay.innerText = `₦${data.balance.toLocaleString()}`;
          firstNameField.innerText = data.first_name || "Not Specified";
          lastNameField.innerText = data.last_name || "Not Specified";
          
          currentFetchedAvatarId = data.avatar_id || "avatar1";
          temporarySelectedAvatarId = currentFetchedAvatarId;
          displayAvatarContainer.innerHTML = SVGA_ALBUM_COLLECTION[currentFetchedAvatarId];

          if (data.nickname) {
            currentFetchedNicknameValue = data.nickname;
            nicknameInput.value = data.nickname;
            heroNickname.innerText = data.nickname;
          } else {
            currentFetchedNicknameValue = "";
            heroNickname.innerText = "AirBy Trader";
          }
        }
      } catch (err) {
        console.error(err);
        displayAdaptiveSystemToast("Error retrieving core database attributes.");
      }
    }

    nicknameInput.addEventListener("input", evaluateMutationState);

    async function commitProfileUpdate() {
      const finalizedNicknameString = nicknameInput.value.trim();

      if (!finalizedNicknameString) {
        displayAdaptiveSystemToast("Nickname space cannot be empty.");
        return;
      }

      try {
        const { error } = await supabaseClient
          .from('users')
          .update({ 
            nickname: finalizedNicknameString,
            avatar_id: temporarySelectedAvatarId
          })
          .eq('email', userSessionEmail.toLowerCase());

        if (error) throw error;

        currentFetchedNicknameValue = finalizedNicknameString;
        currentFetchedAvatarId = temporarySelectedAvatarId;
        heroNickname.innerText = finalizedNicknameString;
        saveChangesTrigger.classList.remove("reveal");
        
        displayAdaptiveSystemToast("Profile updated successfully!", true);
      } catch (err) {
        console.error(err);
        displayAdaptiveSystemToast("Changes rejected. Check SQL setup.");
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadAccountProfileParameters();
    });
  </script>
  <script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js');
  });
}
</script>
