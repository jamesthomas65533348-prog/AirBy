<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Lunex - AirBy AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <meta name="theme-color" content="#0A0F">
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --lunex-primary: #0A84FF;
      --lunex-secondary: #5E5CE6;
      --lunex-accent: #BF5AF2;
      --lunex-gradient: linear-gradient(135deg, #0A84FF 0%, #5E5CE6 50%, #BF5AF2 100%);
      --lunex-glow: rgba(10,132,255,0.3);
      --bg-primary: #000;
      --bg-surface: #0B0F;
      --bg-elevated: #1C1C1E;
      --text-primary: #FFFFFF;
      --text-secondary: #8E8E93;
      --border: rgba(255,255,255,0.08);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(ellipse at top, #1C1C2E 0%, #000000 70%);
      color: var(--text-primary);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Animated Background Particles */
    .bg-particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--lunex-primary);
      border-radius: 50%;
      opacity: 0;
      animation: float 8s infinite;
    }

    @keyframes float {
      0%, 100% { opacity: 0; transform: translateY(0) scale(0); }
      10% { opacity: 0.6; transform: translateY(-20px) scale(1); }
      90% { opacity: 0.6; transform: translateY(-100vh) scale(1); }
    }

    /* Header */
    .lunex-header {
      position: relative;
      z-index: 10;
      padding: calc(16px + env(safe-area-inset-top)) 20px 16px 20px;
      background: rgba(11,11,15,0.8);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .back-btn:active { transform: scale(0.9); }

    .back-btn svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-primary);
      stroke-width: 2;
      fill: none;
    }

    .lunex-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    /* New Lunex Logo - Neural Network Orb */
    .lunex-logo-main {
      width: 44px;
      height: 44px;
      position: relative;
    }

    .lunex-logo-main .core {
      animation: pulse 3s ease-in-out infinite;
    }

    .lunex-logo-main .node {
      animation: nodePulse 2s ease-in-out infinite;
    }

    .lunex-logo-main .node:nth-child(2) { animation-delay: 0.3s; }
    .lunex-logo-main .node:nth-child(3) { animation-delay: 0.6s; }
    .lunex-logo-main .node:nth-child(4) { animation-delay: 0.9s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    @keyframes nodePulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .lunex-info h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--lunex-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .lunex-info p {
      margin: 2px 0 0 0;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(52,199,89,0.15);
      border: 1px solid rgba(52,199,89,0.3);
      border-radius: 20px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #34C759;
      border-radius: 50%;
      animation: statusBlink 2s ease-in-out infinite;
    }

    @keyframes statusBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-indicator span {
      font-size: 12px;
      font-weight: 600;
      color: #34C759;
    }

    /* Chat Container */
        .chat-container {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 100px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .welcome-card {
      background: linear-gradient(135deg, rgba(10,132,255,0.1) 0%, rgba(94,92,230,0.1) 100%);
      border: 1.5px solid rgba(10,132,255,0.2);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      animation: fadeInUp 0.6s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-card h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
      font-weight: 800;
    }

    .welcome-card p {
      margin: 0 20px 0;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .quick-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: left;
    }

    .quick-btn:active {
      transform: scale(0.95);
      background: rgba(10,132,255,0.15);
      border-color: var(--lunex-primary);
    }

    /* Messages */
    .msg {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.6;
      word-wrap: break-word;
      animation: msgSlide 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes msgSlide {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg.user {
      background: var(--lunex-gradient);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 6px;
      box-shadow: 0 8px 24px var(--lunex-glow);
    }

    .msg.ai {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-primary);
      align-self: flex-start;
      border-bottom-left-radius: 6px;
    }

    .msg.thinking {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      align-self: flex-start;
      border-bottom-left-radius: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px;
    }

    .typing-dots {
      display: flex;
      gap: 6px;
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      background: var(--lunex-gradient);
      border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-12px); }
    }

    /* Input Bar */
            .input-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 12px 20px calc(20px + env(safe-area-inset-bottom, 20px)) 20px;
      background: rgba(11,11,15,0.95);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-top: 1px solid var(--border);
      transition: transform 0.2s ease-out;
      will-change: transform;
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

        .input-field {
      flex: 1;
      background: var(--bg-elevated);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 14px 18px;
      color: var(--text-primary);
      font-size: 16px;
      font-family: inherit;
      outline: none;
      resize: none;
      max-height: 120px;
      transition: border-color 0.3s;
      user-select: text;
      -webkit-user-select: text;
    }

    .input-field:focus {
      border-color: var(--lunex-primary);
    }

    .input-field::placeholder {
      color: var(--text-secondary);
    }

    .send-btn {
      width: 48px;
      height: 48px;
      background: var(--lunex-gradient);
      border: none;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
    }

    .send-btn:active {
      transform: scale(0.9);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 22px;
      height: 22px;
      stroke: #fff;
      stroke-width: 2.5;
      fill: none;
    }
  </style>
</head>

<body>
  <!-- Animated Background -->
  <div class="bg-particles" id="particles"></div>

  <!-- Header -->
  <div class="lunex-header">
    <button class="back-btn" onclick="window.location.href='index.html'">
      <svg viewBox="0 24 24">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <div class="lunex-brand">
      <svg class="lunex-logo-main" viewBox="0 0 44 44" fill="none">
        <defs>
          <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0A84FF"/>
            <stop offset="100%" stop-color="#BF5AF2"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <!-- Outer ring -->
        <circle cx="22" cy="22" r="20" stroke="url(#coreGrad)" stroke-width="1.5" opacity="0.3"/>
        <!-- Core -->
        <circle class="core" cx="22" cy="22" r="8" fill="url(#coreGrad)" filter="url(#glow)"/>
        <!-- Nodes -->
        <circle class="node" cx="22" cy="8" r="3" fill="#0A84FF"/>
        <circle class="node" cx="36" cy="22" r="3" fill="#5E5CE6"/>
        <circle class="node" cx="22" cy="36" r="3" fill="#BF5AF2"/>
        <circle class="node" cx="8" cy="22" r="3" fill="#0A84FF"/>
        <!-- Connections -->
        <line x1="22" y1="14" x2="22" y2="11" stroke="url(#coreGrad)" stroke-width="1.5" opacity="0.6"/>
        <line x1="30" y1="22" x2="33" y2="22" stroke="url(#coreGrad)" stroke-width="1.5" opacity="0.6"/>
        <line x1="22" y1="30" x2="22" y2="33" stroke="url(#coreGrad)" stroke-width="1.5" opacity="0.6"/>
        <line x1="14" y1="22" x2="11" y2="22" stroke="url(#coreGrad)" stroke-width="1.5" opacity="0.6"/>
      </svg>
      <div class="lunex-info">
        <h1>Lunex</h1>
        <p>AirBy AI Assistant</p>
      </div>
    </div>
    <div class="status-indicator">
      <div class="status-dot"></div>
      <span>Online</span>
    </div>
  </div>

  <!-- Chat Container -->
  <div class="chat-container" id="chatContainer">
    <div class="welcome-card" id="welcomeCard">
      <h2>Welcome to Lunex</h2>
      <p>Your intelligent AirBy assistant. I have real-time access to your account data.</p>
      <div class="quick-actions">
        <button class="quick-btn" onclick="quickAsk('What\'s my balance?')">💰 Check Balance</button>
        <button class="quick-btn" onclick="quickAsk('Show my last deposit')">📥 Last Deposit</button>
        <button class="quick-btn" onclick="quickAsk('How many tokens do I have?')">💎 My Tokens</button>
        <button class="quick-btn" onclick="quickAsk('Show recent transactions')">📊 Transactions</button>
      </div>
    </div>
  </div>

  <!-- Input Bar -->
    <!-- Input Bar -->
  <div class="input-container" id="inputContainer">
    <div class="input-wrapper">
            <textarea 
        class="input-field" 
        id="inputField" 
        placeholder="Ask me anything about your account..."
        rows="1"
        onkeydown="handleKeydown(event)"
        oninput="autoResize(this)"
        onfocus="scrollToInput()"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const userEmail = localStorage.getItem("user_email");
    let isThinking = false;

    // Generate background particles
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 8 + 's';
        p.style.animationDuration = (Math.random() * 4 + 6) + 's';
        container.appendChild(p);
      }
    }
    createParticles();

    // Auto-resize textarea
        // Auto-resize textarea
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    // Keyboard fix - scroll chat up when keyboard opens
        // Keyboard fix - lift input above keyboard
    function updateKeyboardOffset() {
      const inputBar = document.getElementById('inputContainer');
      const chat = document.getElementById('chatContainer');
      if (!window.visualViewport) return;
      
      const vv = window.visualViewport;
      const keyboardHeight = window.innerHeight - vv.height - vv.offsetTop;
      const kb = Math.max(0, keyboardHeight);
      
      inputBar.style.transform = kb > 0 ? `translateY(-${kb}px)` : '';
      chat.scrollTop = chat.scrollHeight;
    }

    function scrollToInput() {
      updateKeyboardOffset();
      setTimeout(updateKeyboardOffset, 300);
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateKeyboardOffset);
      window.visualViewport.addEventListener('scroll', updateKeyboardOffset);
    }

    // also run when the textarea grows
    const _autoResize = autoResize;
    autoResize = function(el) {
      _autoResize(el);
      updateKeyboardOffset();
    };

    // Handle enter key
    function handleKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    // Quick action buttons
    function quickAsk(question) {
      document.getElementById('inputField').value = question;
      sendMessage();
    }

    // Add message to chat
    function addMessage(text, sender, isThinking = false) {
      const container = document.getElementById('chatContainer');
      const welcomeCard = document.getElementById('welcomeCard');
      if (welcomeCard) welcomeCard.remove();

      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      
      if (isThinking) {
        msg.classList.add('thinking');
        msg.innerHTML = `
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
        `;
      } else {
        msg.innerText = text;
      }
      
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      return msg;
    }

    // Send message
    async function sendMessage() {
      if (isThinking) return;
      
      const input = document.getElementById('inputField');
      const question = input.value.trim();
      if (!question) return;

      if (!userEmail) {
        addMessage('Please log in to use Lunex.', 'ai');
        return;
      }

      addMessage(question, 'user');
      input.value = '';
      input.style.height = 'auto';
      isThinking = true;
      document.getElementById('sendBtn').disabled = true;
      
      const thinkingMsg = addMessage('', 'thinking', true);

      try {
        const { data, error } = await supabaseClient.functions.invoke('lunex', {
          body: { question, user_email: userEmail }
        });
        
        thinkingMsg.remove();
        
        if (error) throw error;
        addMessage(data.answer || 'Sorry, I had an issue processing that. Try again.', 'ai');
        
      } catch (e) {
        thinkingMsg.remove();
        addMessage('Can’t reach Lunex right now. Check your connection and try again.', 'ai');
        console.error('Lunex error:', e);
      } finally {
        isThinking = false;
        document.getElementById('sendBtn').disabled = false;
      }
    }

    // Check auth on load
    if (!userEmail) {
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
