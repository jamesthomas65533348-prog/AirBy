<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Transaction Details - AirBy'</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0066ff">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
    --accent:#0066ff;
    --bg:#000000;
    --card:#0b0b0c;
    --border:#1c1c1e;
    --text:#ffffff;
    --muted:#7d7d7d;
    --green:#00d26a;
    --orange:#ff9500;
    --red:#ff3b30;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
    outline:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

/* Allow text selection only in detail values */
.selectable{
    -webkit-user-select:text !important;
    user-select:text !important;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
    position:relative;
}

/* BACKGROUND */
.market-background{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    opacity:.12;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:0 10px;
    pointer-events:none;
}

.candle-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:12px;
    position:relative;
}

.wick{
    width:2px;
    height:120px;
    background-color:#34c759;
}

.real-body{
    width:14px;
    height:50px;
    background-color:#34c759;
    border-radius:3px;
    position:absolute;
    animation:marketFluctuation 4s ease-in-out infinite alternate;
}

.c1 .real-body{animation-delay:0s;height:60px;}
.c2 .real-body{animation-delay:.8s;height:40px;}
.c3 .real-body{animation-delay:1.5s;height:75px;}
.c4 .real-body{animation-delay:.3s;height:35px;}
.c5 .real-body{animation-delay:2.1s;height:55px;}

@keyframes marketFluctuation{
    0%{transform:translateY(-15px);}
    100%{transform:translateY(15px);}
}

/* APP */
.app-container{
    width:100%;
    max-width:414px;
    min-height:100vh;
    min-height:100dvh;
    margin:auto;
    padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)) 24px;
    position:relative;
    z-index:5;
    overflow-y:auto;
}

/* HEADER */
.top-header-row{
    width:100%;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    margin-bottom:28px;
}

.brand-logo-center{
    font-size:26px;
    font-weight:800;
    letter-spacing:-1px;
    color:#ffffff;
    text-align:center;
    grid-column:2;
}

.brand-logo-center .accent-tick{color:var(--accent);}
.left-actions-group,.right-actions-group{display:flex;align-items:center;}
.left-actions-group{justify-content:flex-start;}
.right-actions-group{justify-content:flex-end;}

.back-btn{
    width:44px;
    height:44px;
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.2s cubic-bezier(0.34,1.56,0.64,1);
    cursor:pointer;
}

.back-btn:active{transform:scale(.92);}
.back-btn i{color:white;font-size:16px;}

/* MAIN CARD */
.details-card{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:28px;
    padding:24px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    animation:fadeIn .4s ease;
}

.status-hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:20px 0 28px 0;
    border-bottom:1.5px solid var(--border);
    margin-bottom:24px;
}

.status-icon-wrap{
    width:80px;
    height:80px;
    border-radius:24px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:16px;
    position:relative;
}

.status-icon-wrap i{
    font-size:32px;
}

.status-icon-wrap.deposit{
    background:rgba(0,210,106,.12);
    color:var(--green);
}

.status-icon-wrap.withdraw{
    background:rgba(255,59,48,.12);
    color:var(--red);
}

.status-title{
    font-size:24px;
    font-weight:800;
    margin-bottom:8px;
    letter-spacing:-.5px;
}

.amount-display{
    font-size:40px;
    font-weight:800;
    letter-spacing:-1.5px;
    margin-bottom:12px;
}

.amount-display.deposit{color:var(--green);}
.amount-display.withdraw{color:var(--red);}

/* ADVANCED STATUS BADGE */
.status-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:800;
    position:relative;
    overflow:hidden;
}

.status-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    position:relative;
}

/* APPROVED */
.status-approved{
    background:rgba(0,210,106,.12);
    color:var(--green);
}

.status-approved .status-dot{
    background:var(--green);
    animation:successPulse 2s ease-in-out infinite;
}

.status-approved::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, transparent, rgba(0,210,106,0.2), transparent);
    transform:translateX(-100%);
    animation:sweepSuccess 3s ease-in-out infinite;
}

/* PENDING */
.status-pending{
    background:rgba(255,149,0,.12);
    color:var(--orange);
}

.status-pending .status-dot{
    background:var(--orange);
    box-shadow:0 0 0 0 rgba(255,149,0,0.7);
    animation:pendingPulse 2s infinite;
}

/* REJECTED */
.status-rejected,
.status-failed{
    background:rgba(255,59,48,.12);
    color:var(--red);
}

.status-rejected .status-dot,
.status-failed .status-dot{
    background:var(--red);
    animation:rejectShake 0.5s ease-in-out;
}

@keyframes successPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(0,210,106,0.7);}
    50%{box-shadow:0 0 0 8px rgba(0,210,106,0);}
}

@keyframes sweepSuccess{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(100%);}
}

@keyframes pendingPulse{
    0%{box-shadow:0 0 0 0 rgba(255,149,0,0.7);}
    70%{box-shadow:0 0 0 10px rgba(255,149,0,0);}
    100%{box-shadow:0 0 0 0 rgba(255,149,0,0);}
}

@keyframes rejectShake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-3px);}
    75%{transform:translateX(3px);}
}

/* DETAILS GRID */
.details-section-title{
    font-size:13px;
    font-weight:800;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:14px;
}

.details-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
    margin-bottom:24px;
}

.detail-row{
    background:#050505;
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    transition:transform .2s cubic-bezier(0.34,1.56,0.64,1), border-color .2s;
    cursor:pointer;
}

.detail-row:active{
    transform:scale(0.98);
    border-color:var(--accent);
}

.detail-label{
    color:#777;
    font-size:11px;
    margin-bottom:6px;
    text-transform:uppercase;
    font-weight:700;
    letter-spacing:.5px;
}

.detail-value{
    font-size:15px;
    font-weight:700;
    word-break:break-all;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.detail-value i{
    color:var(--muted);
    font-size:12px;
    flex-shrink:0;
}

/* ACTION BUTTON */
.share-btn{
    width:100%;
    border:none;
    border-radius:20px;
    background:var(--accent);
    color:white;
    font-size:16px;
    font-weight:800;
    padding:18px;
    cursor:pointer;
    transition:.25s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow:0 10px 25px rgba(0,102,255,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.share-btn:active{transform:scale(.98);}

/* TOAST */
#toast{
    position:fixed;
    top:-100px;
    left:50%;
    transform:translateX(-50%);
    padding:14px 22px;
    border-radius:22px;
    font-size:14px;
    font-weight:700;
    color:white;
    background:#111;
    border:1px solid rgba(255,255,.08);
    z-index:99999;
    transition:.4s cubic-bezier(.175,.885,.32,1.275);
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 18px 35px rgba(0,0,0,.55);
    max-width:90%;
}

#toast.show{top:calc(25px + env(safe-area-inset-top));}
#toast.success{background:#00c851;border:none;}
#toast.error{background:#ff3b30;border:none;}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(12px);}
    to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>

<div class="market-background">
    <div class="candle-container c1"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c2"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c3"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c4"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c5"><div class="wick"></div><div class="real-body"></div></div>
</div>

<div id="toast"></div>

<div class="app-container">

    <div class="top-header-row">
        <div class="left-actions-group">
            <div class="back-btn" onclick="window.location.href='history.html'">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
        </div>
        <div class="brand-logo-center">AirBy<span class="accent-tick">'</span></div>
        <div class="right-actions-group"></div>
    </div>

    <div class="details-card" id="detailsCard">
        <!-- Content injected by JS -->
    </div>

</div>
<!-- HIDDEN RECEIPT TEMPLATE FOR SHARING -->
<div id="receiptTemplate" style="position:fixed; left:-9999px; top:0; width:400px; background:#0b0b0c; padding:30px; font-family:-apple-system,BlinkMacSystemFont,sans-serif;">
  <div style="text-align:center; margin-bottom:24px;">
    <div style="font-size:28px; font-weight:800; color:#fff; margin-bottom:4px;">AirBy<span style="color:#0066ff;">'</span></div>
    <div style="font-size:11px; color:#7d7d7d; letter-spacing:1px; text-transform:uppercase;">Transaction Receipt</div>
  </div>
  
  <div style="background:#050505; border:1.5px solid #1c1c1e; border-radius:20px; padding:20px; margin-bottom:20px;">
    <div style="text-align:center; margin-bottom:16px;">
      <div id="receiptType" style="font-size:16px; font-weight:700; color:#7d7d7d; margin-bottom:8px;"></div>
      <div id="receiptAmount" style="font-size:36px; font-weight:800; margin-bottom:8px;"></div>
      <div id="receiptStatus" style="display:inline-block; padding:8px 14px; border-radius:999px; font-size:12px; font-weight:800;"></div>
    </div>
  </div>

  <div id="receiptDetails" style="font-size:13px;"></div>
  
  <div style="margin-top:24px; padding-top:20px; border-top:1px dashed #1c1c1e; text-align:center;">
    <div style="font-size:10px; color:#5f5f5f; letter-spacing:1px;">SECURED BY FLUTTERWAVE</div>
    <div style="font-size:10px; color:#5f5f5f; margin-top:8px;" id="receiptTimestamp"></div>
  </div>
</div>

<script>
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showToast(message, success = true){
    const toast = document.getElementById("toast");
    toast.className = success ? "success" : "error";
    toast.innerHTML = success
    ? `<i class="fa-solid fa-circle-check"></i> ${message}`
    : `<i class="fa-solid fa-circle-exclamation"></i> ${message}`;
    toast.classList.add("show");
    setTimeout(()=>{toast.classList.remove("show");},3000);
}

function copyToClipboard(text, label){
    navigator.clipboard.writeText(text).then(()=>{
        showToast(`${label} copied`, true);
    }).catch(()=>{
        showToast("Copy failed", false);
    });
}

function formatDate(date){
    return new Date(date).toLocaleString("en-NG",{
        weekday:"short",
        day:"numeric",
        month:"short",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit",
        hour12:true
    });
}

function getStatusClass(status){
    status = (status || "").toLowerCase();
    if(status === "approved" || status === "success") return "status-approved";
    if(status === "pending") return "status-pending";
    return "status-rejected";
}

function getStatusText(status){
    status = (status || "").toLowerCase();
    if(status === "approved" || status === "success") return "Approved";
    if(status === "pending") return "Pending";
    return "Rejected";
}

function renderDetails(){
    const data = JSON.parse(localStorage.getItem("selected_transaction"));
    if(!data){
        window.location.href = "history.html";
        return;
    }
    
    // Remove the Supabase fetch completely
    // Just use 'data' directly
    
    const isDeposit = data.type === "deposit";
    const status = data.status || "pending";
    const card = document.getElementById("detailsCard");
    
    
    card.innerHTML = `
        <div class="status-hero">
            <div class="status-icon-wrap ${isDeposit ? 'deposit' : 'withdraw'}">
                <i class="fa-solid ${isDeposit ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
            </div>
            <div class="status-title">${isDeposit ? 'Wallet Deposit' : 'Bank Withdrawal'}</div>
            <div class="amount-display ${isDeposit ? 'deposit' : 'withdraw'}">
                ${isDeposit ? '+' : '-'}₦${Number(data.amount || 0).toLocaleString()}
            </div>
            <div class="status-badge ${getStatusClass(status)}">
                <div class="status-dot"></div>
                ${getStatusText(status)}
            </div>
        </div>

        <div class="details-section-title">Transaction Details</div>
        <div class="details-grid">
            <div class="detail-row" onclick="copyToClipboard('${data.id || 'N/A'}', 'Transaction ID')">
                <div class="detail-label">Transaction ID</div>
                <div class="detail-value selectable">
                    <span>${data.id || 'N/A'}</span>
                    <i class="fa-regular fa-copy"></i>
                </div>
            </div>
            
            <div class="detail-row">
                <div class="detail-label">Date & Time</div>
                <div class="detail-value selectable">${formatDate(data.created_at)}</div>
            </div>
            
            ${isDeposit ? `
                <div class="detail-row" onclick="copyToClipboard('${data.tx_ref || 'N/A'}', 'Reference')">
                    <div class="detail-label">Reference</div>
                    <div class="detail-value selectable">
                        <span>${data.tx_ref || 'N/A'}</span>
                        <i class="fa-regular fa-copy"></i>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Payment Method</div>
                    <div class="detail-value">Flutterwave</div>
                </div>
            ` : `
                <div class="detail-row">
                    <div class="detail-label">Bank Name</div>
                    <div class="detail-value selectable">${data.bank_name || 'N/A'}</div>
                </div>
                <div class="detail-row" onclick="copyToClipboard('${data.account_number || 'N/A'}', 'Account Number')">
                    <div class="detail-label">Account Number</div>
                    <div class="detail-value selectable">
                        <span>${data.account_number || 'N/A'}</span>
                        <i class="fa-regular fa-copy"></i>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Account Name</div>
                    <div class="detail-value selectable">${data.account_name || 'N/A'}</div>
                </div>
            `}
            
            <div class="detail-row">
                <div class="detail-label">Email</div>
                <div class="detail-value selectable">${data.email || 'N/A'}</div>
            </div>
        </div>

        <button class="share-btn" onclick="shareTransaction()">
            <i class="fa-solid fa-share-nodes"></i>
            Share Receipt
        </button>
    `;
}

async function shareTransaction(){
    const data = JSON.parse(localStorage.getItem("selected_transaction"));
    if(!data) return;
    
    showToast("Generating receipt...", true);
    
    const isDeposit = data.type === "deposit";
    const template = document.getElementById("receiptTemplate");
    
    // Fill receipt data
    document.getElementById("receiptType").innerText = isDeposit? "WALLET DEPOSIT" : "BANK WITHDRAWAL";
    document.getElementById("receiptAmount").innerText = `${isDeposit? '+' : '-'}₦${Number(data.amount || 0).toLocaleString()}`;
    document.getElementById("receiptAmount").style.color = isDeposit? "#00d26a" : "#ff3b30";
    
    const statusEl = document.getElementById("receiptStatus");
    const status = (data.status || "pending").toLowerCase();
    statusEl.innerText = getStatusText(status);
    if(status === "approved" || status === "success"){
        statusEl.style.background = "rgba(0,210,106,.15)";
        statusEl.style.color = "#00d26a";
    }else if(status === "pending"){
        statusEl.style.background = "rgba(255,149,0,.15)";
        statusEl.style.color = "#ff9500";
    }else{
        statusEl.style.background = "rgba(255,59,48,.15)";
        statusEl.style.color = "#ff3b30";
    }
    
    // Build details with ALL deposits table columns
    let detailsHTML = '';
    const addRow = (label, value) => {
        if(value === null || value === undefined || value === '') return;
        detailsHTML += `
            <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #1c1c1e;">
                <span style="color:#7d7d7d; font-weight:600;">${label}</span>
                <span style="color:#fff; font-weight:700; text-align:right; max-width:60%; word-break:break-all;">${value}</span>
            </div>
        `;
    };
    
    addRow("Transaction ID", data.id);
    addRow("Email", data.email);
    addRow("Date", formatDate(data.created_at));
    
    if(isDeposit){
        addRow("Reference", data.tx_ref);
        addRow("Flutterwave ID", data.flw_transaction_id);
        addRow("Payment Method", data.payment_method || "Flutterwave");
        addRow("Currency", data.currency || "NGN");
        addRow("Payment Status", data.payment_status);
        addRow("Verified", data.verified? "Yes" : "No");
        addRow("Completed At", data.completed_at? formatDate(data.completed_at) : null);
        if(data.gateway_response){
            try{
                const gw = JSON.parse(data.gateway_response);
                addRow("Gateway Status", gw.status);
            }catch(e){}
        }
    }else{
        addRow("Bank Name", data.bank_name);
        addRow("Account Number", data.account_number);
        addRow("Account Name", data.account_name);
    }
    
    addRow("Status", getStatusText(data.status));
    document.getElementById("receiptDetails").innerHTML = detailsHTML;
    document.getElementById("receiptTimestamp").innerText = new Date().toLocaleString("en-NG");
    
    // Generate image
    try{
        const canvas = await html2canvas(template, {
            backgroundColor: "#0b0b0c",
            scale: 2,
            logging: false
        });
        
        canvas.toBlob(async (blob) => {
            const file = new File([blob], `AirBy-Receipt-${data.tx_ref || data.id}.png`, { type: "image/png" });
            
            if(navigator.canShare && navigator.canShare({ files: [file] })){
                await navigator.share({
                    files: [file],
                    title: "AirBy Transaction Receipt",
                    text: `Transaction ${data.tx_ref || data.id}`
                });
                showToast("Receipt shared", true);
            }else{
                // Fallback: download
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `AirBy-Receipt-${data.tx_ref || data.id}.png`;
                a.click();
                URL.revokeObjectURL(url);
                showToast("Receipt downloaded", true);
            }
        }, "image/png");
    }catch(err){
        console.log(err);
        showToast("Failed to generate receipt", false);
    }
}
</script>
<script>
window.addEventListener("DOMContentLoaded", renderDetails);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js');
  });
}
</script>
</body>
</html>
