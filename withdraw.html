<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Withdraw Funds - AirBy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0066ff">
<style>
:root{
    --accent:#0066ff;
    --bg:#000000;
    --card:#0b0b0c;
    --border:#1c1c1e;
    --text:#ffffff;
    --muted:#7d7d7d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

input{
    user-select:auto !important;
    -webkit-user-select:auto !important;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
    position:relative;
}

.market-background{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    opacity:.12;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:0 10px;
    pointer-events:none;
}

.candle-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:12px;
    position:relative;
}

.wick{
    width:2px;
    height:120px;
    background-color:#666666;
}

.real-body{
    width:14px;
    height:50px;
    background-color:#666666;
    border-radius:3px;
    position:absolute;
    animation:marketFluctuation 4s ease-in-out infinite alternate;
}

.c1 .real-body{animation-delay:0s;height:60px;}
.c2 .real-body{animation-delay:.8s;height:40px;background-color:#666666;}
.c3 .real-body{animation-delay:1.5s;height:75px;}
.c4 .real-body{animation-delay:.3s;height:35px;}
.c5 .real-body{animation-delay:2.1s;height:55px;}

@keyframes marketFluctuation{
    0%{transform:translateY(-15px);}
    100%{transform:translateY(15px);}
}

.app-container{
    width:100%;
    max-width:414px;
    min-height:100vh;
    min-height:100dvh;
    margin:auto;
    padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)) 24px;
    position:relative;
    z-index:5;
    overflow-y:auto;
}

.top-header-row{
    width:100%;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    margin-bottom:28px;
}

.brand-logo-center{
    font-size:26px;
    font-weight:800;
    letter-spacing:-1px;
    color:#ffffff;
    text-align:center;
    grid-column:2;
}

.brand-logo-center .accent-tick{
    color:var(--accent);
    font-weight:900;
}

.left-actions-group,.right-actions-group{
    display:flex;
    align-items:center;
}

.left-actions-group{justify-content:flex-start;}
.right-actions-group{justify-content:flex-end;}

.back-btn{
    width:44px;
    height:44px;
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.2s cubic-bezier(0.34,1.56,0.64,1);
    cursor:pointer;
}

.back-btn:active{transform:scale(.92);}
.back-btn i{color:white;font-size:16px;}

.withdraw-card{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:28px;
    padding:24px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.page-title{
    font-size:28px;
    font-weight:800;
    letter-spacing:-1px;
    margin-bottom:6px;
}

.page-subtitle{
    color:var(--muted);
    font-size:14px;
    margin-bottom:24px;
}

.balance-box{
    background:#050505;
    border:1px solid var(--border);
    border-radius:22px;
    padding:18px;
    margin-bottom:22px;
}

.balance-label{
    color:#666;
    font-size:12px;
    font-weight:600;
    margin-bottom:8px;
    text-transform:uppercase;
}

.balance{
    font-size:34px;
    font-weight:800;
    letter-spacing:-1px;
}

.input-group{
    position:relative;
    margin-bottom:16px;
}

.input-group i{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    color:#666;
    font-size:14px;
}

input{
    width:100%;
    border:none;
    outline:none;
    background:#050505;
    border:1.5px solid var(--border);
    border-radius:18px;
    color:white;
    padding:17px 18px 17px 50px;
    font-size:15px;
    font-weight:600;
    transition:.25s;
}

input:focus{
    border-color:var(--accent);
    background:#080d18;
    transform:scale(1.01);
}

.bank-selector-btn{
    width:100%;
    background:#050505;
    border:1.5px solid var(--border);
    border-radius:18px;
    color:white;
    padding:17px 18px 17px 50px;
    font-size:15px;
    font-weight:600;
    text-align:left;
    cursor:pointer;
    transition:.25s;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.bank-selector-btn:active{
    transform:scale(0.98);
    border-color:var(--accent);
}

.bank-selector-btn .placeholder{
    color:#3a3a3c;
}

.bank-selector-btn i{
    color:#666;
    font-size:12px;
}

.account-box{
    display:none;
    background:#050505;
    border:1px solid var(--border);
    border-radius:20px;
    padding:16px;
    margin-bottom:16px;
    animation:fadeIn .3s ease;
}

.account-box h3{
    font-size:12px;
    color:#777;
    margin-bottom:8px;
    font-weight:700;
}

.account-name{
    font-size:16px;
    font-weight:800;
    letter-spacing:.3px;
}

.withdraw-btn{
    width:100%;
    border:none;
    border-radius:20px;
    background:var(--accent);
    color:white;
    font-size:16px;
    font-weight:800;
    padding:18px;
    margin-top:8px;
    cursor:pointer;
    transition:.25s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow:0 10px 25px rgba(0,102,255,.25);
}

.withdraw-btn:active{transform:scale(.98);}
.withdraw-btn:disabled{opacity:.45;pointer-events:none;}

.secure-note{
    text-align:center;
    color:#666;
    font-size:12px;
    margin-top:18px;
}

/* FEE BREAKDOWN - Appears when amount > 10000 */
.fee-breakdown{
    background:#050505;
    border:1.5px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:16px;
    display:none;
    animation:fadeIn .3s ease;
}

.fee-breakdown.show{
    display:block;
}

.fee-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    margin-bottom:6px;
}

.fee-row:last-child{
    margin-bottom:0;
    padding-top:8px;
    border-top:1px solid var(--border);
    font-weight:700;
    font-size:14px;
}

.fee-label{
    color:var(--muted);
}

.fee-value{
    color:var(--text);
    font-weight:600;
}

.bank-modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    backdrop-filter:blur(8px);
    z-index:10000;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
}

.bank-modal-overlay.active{
    opacity:1;
    pointer-events:auto;
}

.bank-modal{
    width:100%;
    max-width:414px;
    background:var(--card);
    border:1.5px solid var(--border);
    border-bottom:none;
    border-radius:28px 28px 0 0;
    max-height:85vh;
    max-height:85dvh;
    display:flex;
    flex-direction:column;
    transform:translateY(100%);
    transition:transform .4s cubic-bezier(0.34,1.56,0.64,1);
}

.bank-modal-overlay.active .bank-modal{
    transform:translateY(0);
}

.bank-modal-header{
    padding:20px 20px 16px 20px;
    border-bottom:1.5px solid var(--border);
}

.bank-modal-header h3{
    margin:0 0 12px 0;
    font-size:20px;
    font-weight:800;
}

.bank-search-wrap{
    position:relative;
}

.bank-search-wrap i{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:#666;
    font-size:14px;
}

.bank-search{
    width:100%;
    background:#000;
    border:1.5px solid var(--border);
    border-radius:14px;
    padding:14px 16px 14px 44px;
    color:white;
    font-size:15px;
    font-weight:600;
    outline:none;
    transition:.25s;
}

.bank-search:focus{
    border-color:var(--accent);
    box-shadow:0 0 12px rgba(0,102,255,0.3);
}

.bank-list{
    flex:1;
    overflow-y:auto;
    padding:8px 0;
    -webkit-overflow-scrolling:touch;
}

.bank-item{
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition:background .2s;
    border-bottom:1px solid rgba(28,28,30,0.5);
}

.bank-item:active{
    background:rgba(0,102,255,0.08);
}

.bank-item-logo{
    width:40px;
    height:40px;
    border-radius:10px;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:700;
    color:var(--accent);
    border:1.5px solid var(--border);
    flex-shrink:0;
}

.bank-item-name{
    font-size:15px;
    font-weight:600;
    color:white;
}

.bank-modal-close{
    padding:16px 20px calc(16px + env(safe-area-inset-bottom)) 20px;
    border-top:1.5px solid var(--border);
}

.bank-modal-close button{
    width:100%;
    padding:16px;
    background:#1c1e;
    border:none;
    border-radius:14px;
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.bank-modal-close button:active{
    transform:scale(0.96);
}

#toast{
    position:fixed;
    top:-100px;
    left:50%;
    transform:translateX(-50%);
    padding:14px 22px;
    border-radius:24px;
    font-size:14px;
    font-weight:700;
    color:white;
    background:#111;
    border:1px solid rgba(255,255,.08);
    z-index:99999;
    transition:.4s cubic-bezier(.175,.885,.32,1.275);
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 18px 35px rgba(0,0,0,.55);
    max-width:90%;
}

#toast.show{top:calc(25px + env(safe-area-inset-top));}
#toast.success{background:#00c851;border:none;}
#toast.error{background:#ff3b30;border:none;}

.loading{animation:pulse 1s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:.45;}100%{opacity:1;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

</style>
</head>
<body>

<div class="market-background">
    <div class="candle-container c1"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c2"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c3"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c4"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c5"><div class="wick"></div><div class="real-body"></div></div>
</div>

<div id="toast"></div>

<div class="app-container">

    <div class="top-header-row">
        <div class="left-actions-group">
            <div class="back-btn" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
        </div>
        <div class="brand-logo-center">AirBy<span class="accent-tick">'</span></div>
        <div class="right-actions-group"></div>
    </div>

    <div class="withdraw-card">

        <div class="page-title">Withdraw Funds</div>
        <div class="page-subtitle">Transfer your balance securely to your bank account</div>

        <div class="balance-box">
            <div class="balance-label">Available Balance</div>
            <div class="balance" id="balance">₦0</div>
        </div>

        <div class="input-group">
            <i class="fa-solid fa-building-columns"></i>
            <button class="bank-selector-btn" id="bankSelectorBtn" onclick="openBankModal()">
                <span class="placeholder" id="bankSelectorText">Select Bank</span>
                <i class="fa-solid fa-chevron-down"></i>
            </button>
        </div>

        <div class="input-group">
            <i class="fa-solid fa-credit-card"></i>
            <input type="tel" id="accountNumber" maxlength="10" placeholder="Account Number" />
        </div>

        <div class="account-box" id="accountBox">
            <h3>ACCOUNT NAME</h3>
            <div class="account-name" id="accountName">----------</div>
        </div>

        <div class="input-group">
            <i class="fa-solid fa-money-bill-wave"></i>
            <input type="number" id="amount" placeholder="Withdrawal Amount" />
        </div>

        <div class="fee-breakdown" id="feeBreakdown">
            <div class="fee-row">
                <span class="fee-label">Withdrawal Amount</span>
                <span class="fee-value" id="feeAmount">₦0</span>
            </div>
            <div class="fee-row">
                <span class="fee-label">Processing Fee</span>
                <span class="fee-value" id="feeCharge">₦50</span>
            </div>
            <div class="fee-row">
                <span class="fee-label">Total Debit</span>
                <span class="fee-value" id="feeTotal">₦0</span>
            </div>
        </div>

        <button class="withdraw-btn" id="withdrawBtn">Withdraw Now</button>
        <div class="secure-note">SECURE BANK TRANSFER</div>

    </div>

</div>

<!-- BANK SELECTOR MODAL -->
<div class="bank-modal-overlay" id="bankModalOverlay">
    <div class="bank-modal">
        <div class="bank-modal-header">
            <h3>Select Bank</h3>
            <div class="bank-search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="bank-search" id="bankSearch" placeholder="Search banks..." autocomplete="off">
            </div>
        </div>
        <div class="bank-list" id="bankList">
            <div style="text-align:center;padding:40px;color:#666;">Loading banks...</div>
        </div>
        <div class="bank-modal-close">
            <button onclick="closeBankModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const VERIFY_API = "https://vwcknviabngqvncggeac.supabase.co/functions/v1/verify-account";
const BANKS_API = "https://vwcknviabngqvncggeac.supabase.co/functions/v1/get-banks";

let selectedBankCode = "";
let selectedBankName = "";
let verifiedAccountName = "";
let allBanks = [];

function showToast(message, success = true){
    const toast = document.getElementById("toast");
    toast.className = success ? "success" : "error";
    toast.innerHTML = success
    ? `<i class="fa-solid fa-circle-check"></i> ${message}`
    : `<i class="fa-solid fa-circle-exclamation"></i> ${message}`;
    toast.classList.add("show");
    setTimeout(()=>{toast.classList.remove("show");},3000);
}

async function loadBalance(){
    try{
        const email = localStorage.getItem("user_email");
        if(!email){
            showToast("Login required", false);
            setTimeout(()=>{location.href = "login.html";},1200);
            return;
        }
        const { data, error } = await supabaseClient
        .from("users")
        .select("balance")
        .eq("email", email.toLowerCase())
        .maybeSingle();
        if(error) throw error;
        const balance = data?.balance || 0;
        document.getElementById("balance").innerText = `₦${Number(balance).toLocaleString()}`;
    }catch(err){
        console.log(err);
        showToast("Failed to load balance", false);
    }
}

async function loadBanks(){
    try{
        const response = await fetch(BANKS_API);
        const result = await response.json();
        if(!result.status) throw new Error("Bank fetch failed");
        allBanks = result.data;
        renderBankList(allBanks);
    }catch(err){
        console.log(err);
        document.getElementById("bankList").innerHTML = '<div style="text-align:center;padding:40px;color:#ff3b30;">Failed to load banks</div>';
    }
}

function renderBankList(banks){
    const bankList = document.getElementById("bankList");
    if(banks.length === 0){
        bankList.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">No banks found</div>';
        return;
    }
    bankList.innerHTML = "";
    banks.forEach(bank=>{
        const item = document.createElement("div");
        item.className = "bank-item";
        item.onclick = ()=>selectBank(bank.code, bank.name);
        const logoText = bank.name.substring(0,3).toUpperCase();
        item.innerHTML = `
            <div class="bank-item-logo">${logoText}</div>
            <div class="bank-item-name">${bank.name}</div>
        `;
        bankList.appendChild(item);
    });
}

function openBankModal(){
    document.getElementById("bankModalOverlay").classList.add("active");
    document.getElementById("bankSearch").value = "";
    document.getElementById("bankSearch").focus();
    renderBankList(allBanks);
}

function closeBankModal(){
    document.getElementById("bankModalOverlay").classList.remove("active");
}

function selectBank(code, name){
    selectedBankCode = code;
    selectedBankName = name;
    document.getElementById("bankSelectorText").innerText = name;
    document.getElementById("bankSelectorText").classList.remove("placeholder");
    closeBankModal();
    verifiedAccountName = "";
    document.getElementById("accountBox").style.display = "none";
    document.getElementById("accountNumber").value = "";
}

document.getElementById("bankSearch").addEventListener("input",(e)=>{
    const query = e.target.value.toLowerCase();
    const filtered = allBanks.filter(bank=>bank.name.toLowerCase().includes(query));
    renderBankList(filtered);
});

document.getElementById("accountNumber").addEventListener("input",(e)=>{
    e.target.value = e.target.value.replace(/\D/g,"");
    const accountNumber = e.target.value;
    if(accountNumber.length !== 10) return;
    if(!selectedBankCode){
        showToast("Select bank first", false);
        return;
    }
    verifyAccount(accountNumber);
});

async function verifyAccount(accountNumber){
    try{
        const accountBox = document.getElementById("accountBox");
        const accountName = document.getElementById("accountName");
        accountBox.style.display = "block";
        accountName.innerHTML = `<span class="loading">Verifying account...</span>`;
        const response = await fetch(VERIFY_API,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                account_number:accountNumber,
                bank_code:selectedBankCode
            })
        });
        const result = await response.json();
        if(!result.success){
            accountName.innerText = "Verification Failed";
            verifiedAccountName = "";
            showToast(result.message || "Invalid account", false);
            return;
        }
        verifiedAccountName = result.data.account_name;
        accountName.innerText = verifiedAccountName;
        showToast("Bank account verified", true);
    }catch(err){
        console.log(err);
        verifiedAccountName = "";
        showToast("Verification failed", false);
    }
}

// SHOW/HIDE FEE BREAKDOWN
document.getElementById("amount").addEventListener("input",(e)=>{
    const amount = Number(e.target.value);
    const feeBreakdown = document.getElementById("feeBreakdown");
    const feeAmount = document.getElementById("feeAmount");
    const feeCharge = document.getElementById("feeCharge");
    const feeTotal = document.getElementById("feeTotal");
    
    if(amount > 10000){
        const fee = 50;
        const total = amount + fee;
        feeAmount.innerText = `₦${amount.toLocaleString()}`;
        feeCharge.innerText = `₦${fee}`;
        feeTotal.innerText = `₦${total.toLocaleString()}`;
        feeBreakdown.classList.add("show");
    }else{
        feeBreakdown.classList.remove("show");
    }
});

document.getElementById("withdrawBtn").addEventListener("click", async()=>{
    const button = document.getElementById("withdrawBtn");
    const email = localStorage.getItem("user_email");
    const accountNumber = document.getElementById("accountNumber").value;
    const amount = Number(document.getElementById("amount").value);
    
    if(!selectedBankCode) return showToast("Select a bank", false);
    if(accountNumber.length !== 10) return showToast("Invalid account number", false);
    if(!verifiedAccountName) return showToast("Verify account first", false);
    if(!amount || amount < 1200) return showToast("Minimum withdrawal is ₦1,200", false);
    
    // Calculate fee
    const fee = amount > 10000 ? 50 : 0;
    const totalDebit = amount + fee;
    
    button.disabled = true;
    button.innerText = "PROCESSING...";
    
    try{
        const { data:userData, error:userError } = await supabaseClient
        .from("users")
        .select("balance")
        .eq("email", email.toLowerCase())
        .maybeSingle();
        
        if(userError) throw userError;
        if(!userData){
            button.disabled = false;
            button.innerText = "Withdraw Now";
            return showToast("User account not found", false);
        }
        
        if(Number(userData.balance) < totalDebit){
            button.disabled = false;
            button.innerText = "Withdraw Now";
            return showToast(fee > 0 ? `Insufficient balance. Need ₦${totalDebit.toLocaleString()} (₦${amount.toLocaleString()} + ₦${fee} fee)` : "Insufficient balance", false);
        }
        
        const newBalance = Number(userData.balance) - totalDebit;
        const { error:updateError } = await supabaseClient
        .from("users")
        .update({balance:newBalance})
        .eq("email", email.toLowerCase());
        
        if(updateError) throw updateError;
        
        const { error:withdrawError } = await supabaseClient
        .from("withdrawals")
        .insert([{
            email:email.toLowerCase(),
            bank_name:selectedBankName,
            bank_code:selectedBankCode,
            account_number:accountNumber,
            account_name:verifiedAccountName,
            amount:amount,
            fee:fee,
            status:"pending",
            created_at:new Date()
        }]);
        
        if(withdrawError) throw withdrawError;
        
        showToast(fee > 0 ? `Withdrawal submitted. ₦${fee} fee applied` : "Withdrawal submitted successfully", true);
        document.getElementById("amount").value = "";
        document.getElementById("feeBreakdown").classList.remove("show");
        loadBalance();
        
    }catch(err){
        console.log(err);
        showToast("Withdrawal failed", false);
    }finally{
        button.disabled = false;
        button.innerText = "Withdraw Now";
    }
});

window.addEventListener("DOMContentLoaded",()=>{
    loadBalance();
    loadBanks();
});

// Close modal on overlay click
document.getElementById("bankModalOverlay").addEventListener("click",(e)=>{
    if(e.target.id === "bankModalOverlay") closeBankModal();
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js');
  });
}
</script>
