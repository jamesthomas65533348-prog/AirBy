<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>Withdraw Funds - AirBy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

:root{
    --accent:#0066ff;
    --bg:#000000;
    --card:#0b0b0c;
    --border:#1c1c1e;
    --text:#ffffff;
    --muted:#7d7d7d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

input,
select{
    user-select:auto !important;
    -webkit-user-select:auto !important;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
}

/* BACKGROUND */

.market-background{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    opacity:.12;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:0 10px;
    pointer-events:none;
}

.candle-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:12px;
    position:relative;
}

.wick{
    width:2px;
    height:120px;
    background-color:#34c759;
}

.real-body{
    width:14px;
    height:50px;
    background-color:#34c759;
    border-radius:3px;
    position:absolute;
    animation:marketFluctuation 4s ease-in-out infinite alternate;
}

.c1 .real-body{
    animation-delay:0s;
    height:60px;
}

.c2 .real-body{
    animation-delay:.8s;
    height:40px;
    background-color:#30b34e;
}

.c3 .real-body{
    animation-delay:1.5s;
    height:75px;
}

.c4 .real-body{
    animation-delay:.3s;
    height:35px;
}

.c5 .real-body{
    animation-delay:2.1s;
    height:55px;
}

@keyframes marketFluctuation{
    0%{
        transform:translateY(-15px);
    }
    100%{
        transform:translateY(15px);
    }
}

/* APP */

.app-container{
    width:100%;
    max-width:414px;
    min-height:100vh;
    margin:auto;
    padding:24px;
    position:relative;
    z-index:5;
}

/* HEADER */

.top-header-row{
    width:100%;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding-top:10px;
    margin-bottom:28px;
}

.brand-logo-center{
    font-size:26px;
    font-weight:800;
    letter-spacing:-1px;
    color:#ffffff;
    text-align:center;
    grid-column:2;
}

.brand-logo-center .accent-tick{
    color:var(--accent);
    font-weight:900;
}

.left-actions-group,
.right-actions-group{
    display:flex;
    align-items:center;
}

.left-actions-group{
    justify-content:flex-start;
}

.right-actions-group{
    justify-content:flex-end;
}

.back-btn{
    width:44px;
    height:44px;
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.2s;
}

.back-btn:active{
    transform:scale(.92);
}

.back-btn i{
    color:white;
    font-size:16px;
}

/* CARD */

.withdraw-card{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:28px;
    padding:24px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.page-title{
    font-size:28px;
    font-weight:800;
    letter-spacing:-1px;
    margin-bottom:6px;
}

.page-subtitle{
    color:var(--muted);
    font-size:14px;
    margin-bottom:24px;
}

/* BALANCE */

.balance-box{
    background:#050505;
    border:1px solid var(--border);
    border-radius:22px;
    padding:18px;
    margin-bottom:22px;
}

.balance-label{
    color:#666;
    font-size:12px;
    font-weight:600;
    margin-bottom:8px;
    text-transform:uppercase;
}

.balance{
    font-size:34px;
    font-weight:800;
    letter-spacing:-1px;
}

/* INPUTS */

.input-group{
    position:relative;
    margin-bottom:16px;
}

.input-group i{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    color:#666;
    font-size:14px;
}

input,
select{
    width:100%;
    border:none;
    outline:none;
    background:#050505;
    border:1.5px solid var(--border);
    border-radius:18px;
    color:white;
    padding:17px 18px 17px 50px;
    font-size:15px;
    transition:.25s;
}

input:focus,
select:focus{
    border-color:var(--accent);
    background:#080d18;
}

select{
    appearance:none;
}

/* ACCOUNT BOX */

.account-box{
    display:none;
    background:#050505;
    border:1px solid var(--border);
    border-radius:20px;
    padding:16px;
    margin-bottom:16px;
    animation:fadeIn .3s ease;
}

.account-box h3{
    font-size:12px;
    color:#777;
    margin-bottom:8px;
    font-weight:700;
}

.account-name{
    font-size:16px;
    font-weight:800;
    letter-spacing:.3px;
}

/* BUTTON */

.withdraw-btn{
    width:100%;
    border:none;
    border-radius:20px;
    background:var(--accent);
    color:white;
    font-size:16px;
    font-weight:800;
    padding:18px;
    margin-top:8px;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 10px 25px rgba(0,102,255,.25);
}

.withdraw-btn:active{
    transform:scale(.98);
}

.withdraw-btn:disabled{
    opacity:.45;
    pointer-events:none;
}

.secure-note{
    text-align:center;
    color:#666;
    font-size:12px;
    margin-top:18px;
}

/* TOAST */

#toast{
    position:fixed;
    top:-100px;
    left:50%;
    transform:translateX(-50%);
    padding:14px 22px;
    border-radius:24px;
    font-size:14px;
    font-weight:700;
    color:white;
    background:#111;
    border:1px solid rgba(255,255,255,.08);
    z-index:9999;
    transition:.4s cubic-bezier(.175,.885,.32,1.275);
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 18px 35px rgba(0,0,0,.55);
}

#toast.show{
    top:25px;
}

/* LOADING */

.loading{
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{opacity:1;}
    50%{opacity:.45;}
    100%{opacity:1;}
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>
<body>

<div class="market-background">
    <div class="candle-container c1"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c2"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c3"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c4"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c5"><div class="wick"></div><div class="real-body"></div></div>
</div>

<div id="toast"></div>

<div class="app-container">

    <div class="top-header-row">

        <div class="left-actions-group">
            <div class="back-btn" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
        </div>

        <div class="brand-logo-center">
            AirBy<span class="accent-tick">'</span>
        </div>

        <div class="right-actions-group"></div>

    </div>

    <div class="withdraw-card">

        <div class="page-title">
            Withdraw Funds
        </div>

        <div class="page-subtitle">
            Transfer your balance securely to your bank account
        </div>

        <div class="balance-box">
            <div class="balance-label">
                Available Balance
            </div>

            <div class="balance" id="balance">
                ₦0
            </div>
        </div>

        <div class="input-group">
            <i class="fa-solid fa-building-columns"></i>

            <select id="bank">
                <option value="">Select Bank</option>
            </select>
        </div>

        <div class="input-group">
            <i class="fa-solid fa-credit-card"></i>

            <input
                type="tel"
                id="accountNumber"
                maxlength="10"
                placeholder="Account Number"
            />
        </div>

        <div class="account-box" id="accountBox">

            <h3>ACCOUNT NAME</h3>

            <div class="account-name" id="accountName">
                ----------
            </div>

        </div>

        <div class="input-group">
            <i class="fa-solid fa-money-bill-wave"></i>

            <input
                type="number"
                id="amount"
                placeholder="Withdrawal Amount"
            />
        </div>

        <button
            class="withdraw-btn"
            id="withdrawBtn">

            Withdraw Now

        </button>

        <div class="secure-note">
            
        </div>

    </div>

</div>

<script>

/* IMPORTANT:
DO NOT redeclare supabase.
config.js already contains getClient()
*/

const VERIFY_API =
"https://vwcknviabngqvncggeac.supabase.co/functions/v1/verify-account";

const BANKS_API =
"https://vwcknviabngqvncggeac.supabase.co/functions/v1/get-banks";

const supabaseClient = supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_ANON_KEY
);

let selectedBankCode = "";
let selectedBankName = "";
let verifiedAccountName = "";

function showToast(message, success = true){

    const toast = document.getElementById("toast");

    toast.innerHTML = success
    ? `<i class="fa-solid fa-circle-check" style="color:#00ffa3"></i> ${message}`
    : `<i class="fa-solid fa-circle-exclamation" style="color:#ff3b30"></i> ${message}`;

    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },3000);
}

async function loadBalance(){

    try{

        const email =
        localStorage.getItem("user_email");

        if(!email){
            showToast("Login required", false);

            setTimeout(()=>{
                location.href = "login.html";
            },1200);

            return;
        }

        const { data, error } =
        await supabaseClient
        .from("users")
        .select("balance")
        .eq("email", email.toLowerCase())
        .maybeSingle();

        if(error) throw error;

        const balance = data?.balance || 0;

        document.getElementById("balance").innerText =
        `₦${Number(balance).toLocaleString()}`;

    }catch(err){

        console.log(err);

        showToast("Failed to load balance", false);
    }
}

async function loadBanks(){

    try{

        const response =
        await fetch(BANKS_API);

        const result =
        await response.json();

        if(!result.status){
            throw new Error("Bank fetch failed");
        }

        const bankSelect =
        document.getElementById("bank");

        result.data.forEach(bank=>{

            const option =
            document.createElement("option");

            option.value = bank.code;

            option.textContent = bank.name;

            option.dataset.name = bank.name;

            bankSelect.appendChild(option);
        });

    }catch(err){

        console.log(err);

        showToast("Failed to load banks", false);
    }
}

document.getElementById("bank")
.addEventListener("change",(e)=>{

    selectedBankCode = e.target.value;

    selectedBankName =
    e.target.options[e.target.selectedIndex]
    .dataset.name || "";

    verifiedAccountName = "";

    document.getElementById("accountBox")
    .style.display = "none";
});

document.getElementById("accountNumber")
.addEventListener("input",(e)=>{

    e.target.value =
    e.target.value.replace(/\D/g,"");

    const accountNumber =
    e.target.value;

    if(accountNumber.length !== 10){
        return;
    }

    if(!selectedBankCode){

        showToast("Select bank first", false);

        return;
    }

    verifyAccount(accountNumber);
});

async function verifyAccount(accountNumber){

    try{

        const accountBox =
        document.getElementById("accountBox");

        const accountName =
        document.getElementById("accountName");

        accountBox.style.display = "block";

        accountName.innerHTML =
        `<span class="loading">Verifying account...</span>`;

        const response =
        await fetch(VERIFY_API,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                account_number:accountNumber,
                bank_code:selectedBankCode
            })
        });

        const result =
        await response.json();

        if(!result.success){

            accountName.innerText =
            "Verification Failed";

            verifiedAccountName = "";

            showToast(
                result.message || "Invalid account",
                false
            );

            return;
        }

        verifiedAccountName =
        result.data.account_name;

        accountName.innerText =
        verifiedAccountName;

        showToast(
            "Bank account verified"
        );

    }catch(err){

        console.log(err);

        verifiedAccountName = "";

        showToast(
            "Verification failed",
            false
        );
    }
}

document.getElementById("withdrawBtn")
.addEventListener("click", async()=>{

    const button =
    document.getElementById("withdrawBtn");

    const email =
    localStorage.getItem("user_email");

    const accountNumber =
    document.getElementById("accountNumber")
    .value;

    const amount =
    Number(
        document.getElementById("amount")
        .value
    );

    if(!selectedBankCode){
        return showToast(
            "Select a bank",
            false
        );
    }

    if(accountNumber.length !== 10){
        return showToast(
            "Invalid account number",
            false
        );
    }

    if(!verifiedAccountName){
        return showToast(
            "Verify account first",
            false
        );
    }

    if(!amount || amount < 100){
        return showToast(
            "Minimum withdrawal is ₦100",
            false
        );
    }

    button.disabled = true;
    button.innerText = "PROCESSING...";

    try{

        const {
            data:userData,
            error:userError
        } =
        await supabaseClient
        .from("users")
        .select("balance")
        .eq("email", email.toLowerCase())
        .maybeSingle();

        if(userError) throw userError;

        if(!userData){

            button.disabled = false;
            button.innerText = "Withdraw Now";

            return showToast(
                "User account not found",
                false
            );
        }

        if(Number(userData.balance) < amount){

            button.disabled = false;
            button.innerText = "Withdraw Now";

            return showToast(
                "Insufficient balance",
                false
            );
        }

        const newBalance =
        Number(userData.balance) - amount;

        const { error:updateError } =
        await supabaseClient
        .from("users")
        .update({
            balance:newBalance
        })
        .eq("email", email.toLowerCase());

        if(updateError) throw updateError;

        const { error:withdrawError } =
        await supabaseClient
        .from("withdrawals")
        .insert([{
            email:email.toLowerCase(),
            bank_name:selectedBankName,
            bank_code:selectedBankCode,
            account_number:accountNumber,
            account_name:verifiedAccountName,
            amount:amount,
            status:"pending",
            created_at:new Date()
        }]);

        if(withdrawError) throw withdrawError;

        showToast(
            "Withdrawal submitted successfully"
        );

        document.getElementById("amount").value = "";

        loadBalance();

    }catch(err){

        console.log(err);

        showToast(
            "Withdrawal failed",
            false
        );

    }finally{

        button.disabled = false;

        button.innerText = "Withdraw Now";
    }
});

window.addEventListener("DOMContentLoaded",()=>{

    loadBalance();

    loadBanks();

});

</script>

</body>
</html>
