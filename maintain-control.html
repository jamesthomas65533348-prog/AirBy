<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Maintenance Control - AirBy</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root{
        --accent:#0066ff;
        --bg:#000000;
        --card:#0b0c;
        --border:#1c1e;
        --text:#ffffff;
        --muted:#7d7d7d;
        --red:#ff3b30;
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        -webkit-tap-highlight-color:transparent;
        -webkit-touch-callout:none;
        -webkit-user-select:none;
        user-select:none;
        outline:none;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }

    input,textarea{
        -webkit-user-select:auto !important;
        user-select:auto !important;
    }

    body{
        background:var(--bg);
        color:var(--text);
        min-height:100vh;
        min-height:100dvh;
        overflow-x:hidden;
        position:relative;
    }

    .market-background{
        position:fixed;
        inset:0;
        width:100%;
        height:100%;
        z-index:1;
        opacity:.12;
        display:flex;
        justify-content:space-around;
        align-items:center;
        padding:0 10px;
        pointer-events:none;
    }

    .candle-container{
        display:flex;
        flex-direction:column;
        align-items:center;
        width:12px;
        position:relative;
    }

    .wick{
        width:2px;
        height:120px;
        background-color:#34c759;
    }

    .real-body{
        width:14px;
        height:50px;
        background-color:#34c759;
        border-radius:3px;
        position:absolute;
        animation:marketFluctuation 4s ease-in-out infinite alternate;
    }

    .c1 .real-body{animation-delay:0s;height:60px;}
    .c2 .real-body{animation-delay:.8s;height:40px;}
    .c3 .real-body{animation-delay:1.5s;height:75px;}
    .c4 .real-body{animation-delay:.3s;height:35px;}
    .c5 .real-body{animation-delay:2.1s;height:55px;}

    @keyframes marketFluctuation{
        0%{transform:translateY(-15px);}
        100%{transform:translateY(15px);}
    }

    .app-container{
        width:100%;
        max-width:600px;
        min-height:100vh;
        min-height:100dvh;
        margin:auto;
        padding:calc(24px + env(safe-area-inset-top)) 24px calc(100px + env(safe-area-inset-bottom)) 24px;
        position:relative;
        z-index:5;
        overflow-y:auto;
    }

    .top-header-row{
        width:100%;
        display:grid;
        grid-template-columns:1fr auto 1fr;
        align-items:center;
        margin-bottom:28px;
    }

    .brand-logo-center{
        font-size:26px;
        font-weight:800;
        letter-spacing:-1px;
        color:#ffffff;
        text-align:center;
        grid-column:2;
    }

    .brand-logo-center .accent-tick{color:var(--accent);}
    .left-actions-group,.right-actions-group{display:flex;align-items:center;}
    .left-actions-group{justify-content:flex-start;}
    .right-actions-group{justify-content:flex-end;}

    .back-btn{
        width:44px;
        height:44px;
        background:var(--card);
        border:1.5px solid var(--border);
        border-radius:14px;
        display:flex;
        justify-content:center;
        align-items:center;
        transition:.2s cubic-bezier(0.34,1.56,0.64,1);
        cursor:pointer;
    }

    .back-btn:active{transform:scale(.92);}
    .back-btn i{color:white;font-size:16px;}

    .section{
        background:var(--card);
        border:1.5px solid var(--border);
        border-radius:24px;
        padding:24px 20px;
        margin-bottom:24px;
        box-shadow:0 10px 30px rgba(0,0,0,.4);
    }

    .section h2{
        color:var(--accent);
        margin-bottom:16px;
        font-size:22px;
        font-weight:800;
    }

    .section p{
        color:var(--muted);
        font-size:14px;
        line-height:1.5;
        margin-bottom:20px;
    }

    .toggle-wrap{
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:18px;
        background:#050505;
        border:1.5px solid var(--border);
        border-radius:18px;
        margin-bottom:20px;
    }

    .toggle-info h4{
        margin:0 0 4px 0;
        font-size:16px;
        font-weight:800;
    }

    .toggle-info p{
        margin:0;
        font-size:13px;
        color:var(--muted);
    }

    .toggle-switch{
        position:relative;
        width:60px;
        height:32px;
    }

    .toggle-switch input{
        opacity:0;
        width:0;
        height:0;
    }

    .toggle-slider{
        position:absolute;
        cursor:pointer;
        top:0;
        left:0;
        right:0;
        bottom:0;
        background:var(--border);
        border-radius:34px;
        transition:.3s;
    }

    .toggle-slider:before{
        position:absolute;
        content:"";
        height:24px;
        width:24px;
        left:4px;
        bottom:4px;
        background:white;
        border-radius:50%;
        transition:.3s;
    }

    input:checked + .toggle-slider{
        background:var(--red);
    }

    input:checked + .toggle-slider:before{
        transform:translateX(28px);
    }

    .input{
        width:100%;
        padding:14px 16px;
        margin:8px 0;
        border-radius:14px;
        border:1.5px solid var(--border);
        background:#050505;
        color:white;
        font-size:15px;
        font-weight:600;
        transition:.25s;
    }

    .input:focus{
        border-color:var(--accent);
        background:#080d18;
    }

    textarea.input{
        min-height:120px;
        resize:vertical;
        font-family:inherit;
    }

    .btn{
        background:var(--accent);
        color:white;
        border:none;
        padding:14px 20px;
        margin:5px 0;
        border-radius:14px;
        cursor:pointer;
        font-weight:700;
        font-size:15px;
        transition:.25s cubic-bezier(0.34,1.56,0.64,1);
        width:100%;
        position:relative;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:8px;
    }

    .btn:hover{opacity:0.9;}
    .btn:active{transform:scale(0.96);}
    .btn:disabled{opacity:0.5;pointer-events:none;}

    .btn .loader{
        width:16px;
        height:16px;
        border:2px solid rgba(255,255,255,0.3);
        border-top-color:white;
        border-radius:50%;
        animation:spin 0.6s linear infinite;
        display:none;
    }

    .btn.loading .loader{display:block;}
    .btn.loading .btn-text{display:none;}

    @keyframes spin{
        to{transform:rotate(360deg);}
    }

    .status-badge{
        display:inline-flex;
        align-items:center;
        gap:8px;
        padding:8px 14px;
        border-radius:12px;
        font-size:13px;
        font-weight:700;
        margin-bottom:16px;
    }

    .status-badge.on{
        background:rgba(255,59,48,0.15);
        color:var(--red);
        border:1.5px solid rgba(255,59,48,0.3);
    }

    .status-badge.off{
        background:rgba(0,210,106,0.15);
        color:#00d26a;
        border:1.5px solid rgba(0,210,106,0.3);
    }

    .popup-container{
        position:fixed;
        top:calc(25px + env(safe-area-inset-top));
        left:50%;
        transform:translateX(-50%);
        z-index:99999;
        display:flex;
        flex-direction:column;
        gap:12px;
        max-width:90%;
        pointer-events:none;
    }

    .popup{
        background:var(--card);
        border:1.5px solid var(--border);
        color:white;
        padding:16px 20px;
        border-radius:20px;
        font-weight:700;
        font-size:14px;
        display:flex;
        align-items:center;
        gap:12px;
        box-shadow:0 20px 40px rgba(0,0,0,.6);
        animation:popupSlideIn.4s cubic-bezier(.175,.885,.32,1.275);
        pointer-events:auto;
        min-width:280px;
    }

    .popup.success{border-color:#00d26a;background:rgba(0,210,106,0.15);}
    .popup.error{border-color:var(--red);background:rgba(255,59,48,0.15);}
    .popup i{font-size:18px;}

    @keyframes popupSlideIn{
        from{transform:translateY(-100px);opacity:0;}
        to{transform:translateY(0);opacity:1;}
    }

    .login-required{
        text-align:center;
        padding:60px 20px;
    }

    .login-required i{
        font-size:64px;
        color:var(--red);
        margin-bottom:20px;
        opacity:0.5;
    }

    .login-required h3{
        font-size:24px;
        margin-bottom:12px;
    }

    .login-required p{
        color:var(--muted);
        margin-bottom:24px;
    }
  </style>
</head>
<body>

<div class="market-background">
    <div class="candle-container c1"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c2"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c3"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c4"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c5"><div class="wick"></div><div class="real-body"></div></div>
</div>

<div class="popup-container" id="popupContainer"></div>

<div class="app-container">

    <div class="top-header-row">
        <div class="left-actions-group">
            <div class="back-btn" onclick="window.location.href='admin.html'">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
        </div>
        <div class="brand-logo-center">AirBy<span class="accent-tick">'</span></div>
        <div class="right-actions-group"></div>
    </div>

    <div id="authCheck" class="login-required">
        <i class="fa-solid fa-lock"></i>
        <h3>Admin Access Required</h3>
        <p>Checking permissions...</p>
    </div>

    <div id="adminContent" style="display:none;">
        <div class="section">
            <h2>Maintenance Mode Control</h2>
            <p>When enabled, all users except admins will see a maintenance screen and cannot access the site.</p>
            
            <div id="currentStatus" class="status-badge off">
                <i class="fa-solid fa-circle-check"></i>
                <span>Currently OFF</span>
            </div>

            <div class="toggle-wrap">
                <div class="toggle-info">
                    <h4>Maintenance Mode</h4>
                    <p id="toggleStatus">Site is live</p>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="maintenanceToggle" onchange="toggleMaintenance()">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <label style="display:block;margin-bottom:8px;font-weight:700;font-size:14px;">Maintenance Message</label>
            <textarea id="maintenanceMessage" class="input" placeholder="Message shown to users during maintenance...">We are upgrading AirBy. Check back soon.</textarea>
            
            <button class="btn" onclick="updateMaintenanceMessage()" id="updateMsgBtn">
                <span class="btn-text">Update Message</span>
                <div class="loader"></div>
            </button>
        </div>
    </div>

</div>

<script>
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentSettings = {};

function showPopup(message, type = 'success') {
    const container = document.getElementById('popupContainer');
    const icons = {
        success: '<i class="fa-solid fa-circle-check"></i>',
        error: '<i class="fa-solid fa-circle-xmark"></i>',
        info: '<i class="fa-solid fa-circle-info"></i>'
    };
    const popup = document.createElement('div');
    popup.className = `popup ${type}`;
    popup.innerHTML = `${icons[type]} ${message}`;
    container.appendChild(popup);

    setTimeout(() => {
        popup.style.animation = 'popupSlideOut.4s cubic-bezier(.175,.885,.32,1.275) forwards';
        setTimeout(() => popup.remove(), 400);
    }, 3500);
}

function setButtonLoading(btn, loading) {
    if (loading) {
        btn.classList.add('loading');
        btn.disabled = true;
    } else {
        btn.classList.remove('loading');
        btn.disabled = false;
    }
}

async function checkAdminAccess() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    
    if (!user) {
        document.getElementById('authCheck').innerHTML = `
            <i class="fa-solid fa-lock"></i>
            <h3>Login Required</h3>
            <p>Please login to access admin controls.</p>
            <button class="btn" onclick="window.location.href='login.html'" style="margin-top:20px;">Go to Login</button>
        `;
        return false;
    }

    const { data: userData } = await supabaseClient
        .from('users')
        .select('is_admin')
        .eq('email', user.email)
        .single();

    if (!userData || userData.is_admin !== true) {
        document.getElementById('authCheck').innerHTML = `
            <i class="fa-solid fa-ban"></i>
            <h3>Access Denied</h3>
            <p>You do not have admin privileges.</p>
            <button class="btn" onclick="window.location.href='index.html'" style="margin-top:20px;">Go Home</button>
        `;
        return false;
    }

    document.getElementById('authCheck').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    return true;
}

async function loadMaintenanceStatus() {
    const { data, error } = await supabaseClient
        .from('site_settings')
        .select('*')
        .eq('id', 1)
        .single();

    if (error) {
        console.error(error);
        showPopup('Failed to load settings', 'error');
        return;
    }

    currentSettings = data;
    const toggle = document.getElementById('maintenanceToggle');
    const statusBadge = document.getElementById('currentStatus');
    const toggleStatus = document.getElementById('toggleStatus');
    const messageInput = document.getElementById('maintenanceMessage');

    toggle.checked = data.maintenance_mode;
    messageInput.value = data.maintenance_message;

    if (data.maintenance_mode) {
        statusBadge.className = 'status-badge on';
        statusBadge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i><span>Currently ON</span>';
        toggleStatus.innerText = 'Site is in maintenance mode';
    } else {
        statusBadge.className = 'status-badge off';
        statusBadge.innerHTML = '<i class="fa-solid fa-circle-check"></i><span>Currently OFF</span>';
        toggleStatus.innerText = 'Site is live';
    }
}

async function toggleMaintenance() {
    const toggle = document.getElementById('maintenanceToggle');
    const newState = toggle.checked;
    const user = (await supabaseClient.auth.getUser()).data.user;

    const { error } = await supabaseClient
        .from('site_settings')
        .update({ 
            maintenance_mode: newState,
            updated_at: new Date().toISOString(),
            updated_by: user.email
        })
        .eq('id', 1);

    if (error) {
        console.error(error);
        showPopup('Failed to update maintenance mode', 'error');
        toggle.checked = !newState;
        return;
    }

    showPopup(`Maintenance mode ${newState ? 'ENABLED' : 'DISABLED'}`, newState ? 'info' : 'success');
    loadMaintenanceStatus();
}

async function updateMaintenanceMessage() {
    const btn = event.target;
    setButtonLoading(btn, true);

    const message = document.getElementById('maintenanceMessage').value.trim();
    const user = (await supabaseClient.auth.getUser()).data.user;

    const { error } = await supabaseClient
        .from('site_settings')
        .update({ 
            maintenance_message: message,
            updated_at: new Date().toISOString(),
            updated_by: user.email
        })
        .eq('id', 1);

    if (error) {
        console.error(error);
        showPopup('Failed to update message', 'error');
        setButtonLoading(btn, false);
        return;
    }

    showPopup('Maintenance message updated', 'success');
    setButtonLoading(btn, false);
}

window.addEventListener('DOMContentLoaded', async () => {
    const isAdmin = await checkAdminAccess();
    if (isAdmin) {
        await loadMaintenanceStatus();
        
        // Realtime listener for settings changes
        supabaseClient
            .channel('maintenance-sync')
            .on('postgres_changes', 
                { event: 'UPDATE', schema: 'public', table: 'site_settings', filter: 'id=eq.1' }, 
                () => loadMaintenanceStatus()
            )
            .subscribe();
    }
});
</script>

</body>
</html>
