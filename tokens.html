<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Tokens - AirBy</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script>
    const SUPABASE_URL = "https://vwcknviabngqvncggeac.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3Y2tudmlhYm5ncXZuY2dnZWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk4NDYyODEsImV4cCI6MjA3NTQyMjI4MX0.R5P7kyaiIQ91AwMcjUbovqUrAoYbuXyDnIgQK9H_wIk";
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Poppins", Roboto, Helvetica, Arial, sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #000000;
      color: #ffffff;
      padding: 18px 18px 120px 18px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 414px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .back-btn {
      background: #0b0b0c;
      color: #ffffff;
      border: 1.5px solid #1c1c1e;
      border-radius: 14px;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.25s ease;
    }

    .back-btn:active {
      transform: scale(0.94);
      border-color: #0066ff;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .search-box {
      position: relative;
      margin-bottom: 20px;
      border-radius: 14px;
      padding: 1.5px;
      background: transparent;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .search-input {
      width: 100%;
      padding: 16px;
      background: #0b0b0c;
      border: 1.5px solid #1c1c1e;
      border-radius: 13px;
      font-size: 16px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
      -webkit-user-select: text;
      user-select: text;
    }

    .search-input:focus {
      border-color: #0066ff;
      transform: scale(1.015);
      box-shadow: 0 0 12px rgba(0, 102, 255, 0.4);
    }

    .search-input::placeholder {
      color: #48484a;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0b0b0c;
      border: 1.5px solid #1c1c1e;
      padding: 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .card:active {
      transform: scale(0.97);
      border-color: #0066ff;
      box-shadow: 0 0 12px rgba(0, 102, 255, 0.4);
    }

    .left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      border: 1.5px solid #1c1c1e;
      overflow: hidden;
      color: #0066ff;
    }

    .token-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .name {
      font-weight: 700;
      font-size: 16px;
    }

    .symbol {
      font-size: 13px;
      color: #666666;
    }

    .price {
      font-weight: 700;
      font-size: 16px;
      color: #ffffff;
    }

    .total-assets-btn {
      position: fixed;
      bottom: 24px;
      right: 20px;
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 16px 20px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0px 8px 24px rgba(255, 255, 255, 0.15);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
    }

    .total-assets-btn:active {
      transform: scale(0.94);
      background-color: #e5e5e5;
    }

    .modal-back {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: #0b0b0c;
      border: 1.5px solid #1c1c1e;
      border-bottom: none;
      padding: 24px;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 414px;
      color: #ffffff;
      animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    #modalName {
      font-weight: 800;
      font-size: 20px;
    }

    #modalSymbol {
      font-size: 14px;
      color: #666666;
      margin-top: 2px;
    }

    #modalPrice {
      font-weight: 800;
      font-size: 18px;
      color: #0066ff;
    }

    .input-row {
      position: relative;
      margin-bottom: 14px;
      border-radius: 14px;
      padding: 1.5px;
      background: transparent;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .input {
      width: 100%;
      padding: 16px;
      background: #000000;
      border: 1.5px solid #1c1c1e;
      border-radius: 13px;
      font-size: 16px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
      -webkit-user-select: text;
      user-select: text;
    }

    .input:focus {
      border-color: #0066ff;
      transform: scale(1.015);
      box-shadow: 0 0 12px rgba(0, 102, 255, 0.4);
    }

    .input::placeholder {
      color: #48484a;
    }

    .neon-blue-glow {
      border-color: #0066ff !important;
      box-shadow: 0 0 12px rgba(0, 102, 255, 0.4);
    }

    .neon-green-glow {
      border-color: #34c759 !important;
      box-shadow: 0 0 12px rgba(52, 199, 89, 0.4);
    }

    .neon-red-glow {
      border-color: #ff3b30 !important;
      box-shadow: 0 0 12px rgba(255, 59, 48, 0.4);
    }

    .shake-row {
      animation: shakePhysics 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shakePhysics {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    #calculatedTokens {
      font-size: 14px;
      color: #666666;
      margin: 12px 0 16px 0;
    }

    .btn {
      width: 100%;
      padding: 16px;
      background-color: #ffffff;
      color: #000000;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease;
      margin-bottom: 10px;
    }

    .btn:active {
      transform: scale(0.94);
      background-color: #e5e5e5;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #0b0b0c;
      color: #ffffff;
      border: 1.5px solid #1c1c1e;
    }

    .btn-secondary:active {
      background-color: #1c1c1e;
    }

    .loader-spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid #000000;
      border-top: 2.5px solid transparent;
      border-radius: 50%;
      animation: spinDevice 0.75s linear infinite;
      display: none;
    }

    @keyframes spinDevice {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .airby-toast {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      box-shadow: 0px 12px 30px rgba(0, 0, 0, 0.7);
      z-index: 10000;
      transition: top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      white-space: nowrap;
    }

    .airby-toast.show {
      top: 24px;
    }

    .airby-toast.error { background-color: #ff3b30; }
    .airby-toast.success { background-color: #34c759; }

    .empty {
      opacity: .85;
      text-align: center;
      padding: 32px 18px;
      border-radius: 14px;
      border: 1.5px dashed #1c1c1e;
      margin-top: 20px;
      color: #666666;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <button class="back-btn" onclick="location.href='index.html'">← Home</button>
      <h1>Tokens</h1>
      <div style="width:68px"></div>
    </div>

    <div class="search-box">
      <input id="searchInput" class="search-input" type="text" placeholder="Search tokens" />
    </div>

    <div id="list" class="list">
      <div class="empty">Loading tokens...</div>
    </div>
  </div>

  <button class="total-assets-btn" onclick="location.href='total-assets.html'">💰 Total Assets</button>

  <!-- Modal -->
  <div id="modalBack" class="modal-back">
    <div class="modal" id="modal">
      <div class="modal-header">
        <div>
          <div id="modalName"></div>
          <div id="modalSymbol"></div>
        </div>
        <div id="modalPrice"></div>
      </div>

      <div class="input-row" id="amountRow">
        <input id="buyAmountNaira" class="input" type="number" placeholder="Enter Naira amount (₦)" min="1" />
      </div>
      
      <div id="calculatedTokens">You will receive: 0 tokens</div>
      
      <button id="buyBtn" class="btn">
        <span id="btnText">Buy Token</span>
        <div class="loader-spinner" id="btnLoader"></div>
      </button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script>
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const email = localStorage.getItem("user_email");

    async function autoUpdateRank(email) {
      if (!email) return;
      const { data: tokensData, error } = await supabaseClient
        .from('user_token')
        .select('amount_spent')
        .eq('email', email);
      if (error || !tokensData) return console.error('Rank fetch error:', error);
      const totalSpent = tokensData.reduce((sum, t) => sum + Number(t.amount_spent || 0), 0);
      let newRank = 'Silver';
      if (totalSpent >= 1000000) newRank = 'Master';
      else if (totalSpent >= 300000) newRank = 'Diamond';
      else if (totalSpent >= 70000) newRank = 'Gold';
      else if (totalSpent >= 20000) newRank = 'Bronze';
      else if (totalSpent >= 7000) newRank = 'Rookie';

      const { data: existingRank } = await supabaseClient
        .from('rank_progress')
        .select('email')
        .eq('email', email)
        .maybeSingle();

      if (existingRank) {
        await supabaseClient.from('rank_progress').update({
          current_rank: newRank,
          rank_start: totalSpent,
          updated_at: new Date().toISOString(),
        }).eq('email', email);
      } else {
        await supabaseClient.from('rank_progress').insert([{
          email: email,
          current_rank: newRank,
          rank_start: totalSpent,
          last_reset: new Date().toISOString(),
          updated_at: new Date().toISOString(),
        }]);
      }
    }

    function showPopup(message, type = "error") {
      let toast = document.querySelector('.airby-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'airby-toast';
        document.body.appendChild(toast);
      }
      toast.className = `airby-toast ${type}`;
      toast.innerText = message;
      setTimeout(() => toast.classList.add('show'), 50);
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    const list = document.getElementById("list");
    const modalBack = document.getElementById("modalBack");
    const modalName = document.getElementById("modalName");
    const modalSymbol = document.getElementById("modalSymbol");
    const modalPrice = document.getElementById("modalPrice");
    const buyAmountNaira = document.getElementById("buyAmountNaira");
    const calculatedTokens = document.getElementById("calculatedTokens");
    const buyBtn = document.getElementById("buyBtn");
    const btnText = document.getElementById("btnText");
    const btnLoader = document.getElementById("btnLoader");
    const amountRow = document.getElementById("amountRow");
    const searchInput = document.getElementById("searchInput");

    let tokens = [];
    let filteredTokens = [];
    let selectedToken = null;

    async function fetchTokens() {
      const { data, error } = await supabaseClient
        .from("tokens")
        .select("*")
        .eq("status", "active")
        .order("updated_at", { ascending: false });
      if (error) return showPopup("Error loading tokens");
      tokens = data || [];
      filteredTokens = [...tokens];
      renderList();
    }

    function renderList() {
      list.innerHTML = "";
      if (!filteredTokens.length) return (list.innerHTML = '<div class="empty">No tokens found</div>');
      filteredTokens.forEach(t => {
        const c = document.createElement("div");
        c.className = "card";
        c.onclick = () => openModal(t);
        const left = document.createElement("div");
        left.className = "left";
        const logo = document.createElement("div");
        logo.className = "logo";
        if (t.logo_url) {
          const img = document.createElement("img");
          img.src = t.logo_url;
          img.style.width = "100%";
          img.style.height = "100%";
          img.style.objectFit = "cover";
          logo.appendChild(img);
        } else logo.innerText = (t.symbol || "TK").slice(0, 3).toUpperCase();

        const info = document.createElement("div");
        info.className = "token-info";
        info.innerHTML = `<div class="name">${t.name}</div><div class="symbol">${t.symbol}</div>`;
        left.append(logo, info);

        const price = document.createElement("div");
        price.className = "price";
        price.innerText = `₦${Number(t.current_price).toLocaleString()}`;
        c.append(left, price);
        list.appendChild(c);
      });
    }

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      filteredTokens = tokens.filter(t =>
        t.name.toLowerCase().includes(q) || t.symbol.toLowerCase().includes(q)
      );
      renderList();
    });

    function openModal(token) {
      selectedToken = token;
      modalName.innerText = token.name;
      modalSymbol.innerText = token.symbol;
      modalPrice.innerText = `₦${Number(token.current_price).toLocaleString()}`;
      buyAmountNaira.value = "";
      calculatedTokens.innerText = "You will receive: 0 tokens";
      clearAnimationClasses();
      modalBack.style.display = "flex";
    }

    function closeModal() {
      modalBack.style.display = "none";
      selectedToken = null;
      resetButtonUI();
    }

    function clearAnimationClasses() {
      amountRow.classList.remove("neon-blue-glow", "neon-green-glow", "neon-red-glow", "shake-row");
    }

    function resetButtonUI() {
      btnText.style.display = "block";
      btnLoader.style.display = "none";
      buyBtn.disabled = false;
    }

    buyAmountNaira.addEventListener("input", () => {
      const v = parseFloat(buyAmountNaira.value) || 0;
      const qty = selectedToken && selectedToken.current_price > 0 ? v / Number(selectedToken.current_price) : 0;
      calculatedTokens.innerText = `You will receive: ${qty ? qty.toFixed(8) : 0} ${selectedToken ? selectedToken.symbol : ""}`;
      clearAnimationClasses();
      if (v > 0) amountRow.classList.add("neon-blue-glow");
    });

    modalBack.addEventListener("click", e => { if (e.target === modalBack) closeModal(); });

    buyBtn.addEventListener("click", async () => {
      if (!selectedToken) return;
      const nairaAmount = parseFloat(buyAmountNaira.value);
      if (!nairaAmount || nairaAmount <= 0) {
        showPopup("Enter a valid amount", "error");
        clearAnimationClasses();
        amountRow.classList.add("neon-red-glow", "shake-row");
        setTimeout(() => amountRow.classList.remove("shake-row"), 400);
        return;
      }

      if (!email) return showPopup("Please login first", "error");

      btnText.style.display = "none";
      btnLoader.style.display = "block";
      buyBtn.disabled = true;

      try {
        const { data: user, error: userError } = await supabaseClient
          .from("users")
          .select("balance")
          .eq("email", email)
          .single();

        if (userError || !user) {
          showPopup("Error verifying balance", "error");
          clearAnimationClasses();
          amountRow.classList.add("neon-red-glow");
          resetButtonUI();
          return;
        }

        if (user.balance < nairaAmount) {
          showPopup("Insufficient balance", "error");
          clearAnimationClasses();
          amountRow.classList.add("neon-red-glow", "shake-row");
          setTimeout(() => amountRow.classList.remove("shake-row"), 400);
          resetButtonUI();
          return;
        }

        const tokensToReceive = nairaAmount / Number(selectedToken.current_price);

        const { data: existing } = await supabaseClient
          .from("user_token")
          .select("*")
          .eq("email", email)
          .eq("token_id", selectedToken.id)
          .maybeSingle();

        if (existing) {
          await supabaseClient.from("user_token")
            .update({
              quantity: existing.quantity + tokensToReceive,
              amount_spent: existing.amount_spent + nairaAmount,
              updated_at: new Date().toISOString(),
            })
            .eq("id", existing.id);
        } else {
          await supabaseClient.from("user_token").insert([{
            email: email,
            token_id: selectedToken.id,
            quantity: tokensToReceive,
            amount_spent: nairaAmount,
          }]);
        }

        await supabaseClient
          .from("users")
          .update({ balance: user.balance - nairaAmount })
          .eq("email", email);

        await autoUpdateRank(email);

        clearAnimationClasses();
        amountRow.classList.add("neon-green-glow");
        showPopup(`You bought ${tokensToReceive.toFixed(6)} ${selectedToken.symbol}`, "success");
        
        setTimeout(() => {
          closeModal();
        }, 1500);

      } catch (e) {
        console.error(e);
        showPopup("Something went wrong. Try again.", "error");
        clearAnimationClasses();
        amountRow.classList.add("neon-red-glow");
        resetButtonUI();
      }
    });

    fetchTokens();
    setInterval(fetchTokens, 15000);
  </script>
</body>
</html>
