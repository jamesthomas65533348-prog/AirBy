  <script>
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const email = localStorage.getItem("user_email");

  async function autoUpdateRank(email) {
    if (!email) return;
    const { data: tokensData, error } = await supabaseClient
.from('user_token')
.select('amount_spent')
.eq('email', email);
    if (error ||!tokensData) return console.error('Rank fetch error:', error);
    const totalSpent = tokensData.reduce((sum, t) => sum + Number(t.amount_spent || 0), 0);
    let newRank = 'Silver';
    if (totalSpent >= 1000000) newRank = 'Master';
    else if (totalSpent >= 300000) newRank = 'Diamond';
    else if (totalSpent >= 70000) newRank = 'Gold';
    else if (totalSpent >= 20000) newRank = 'Bronze';
    else if (totalSpent >= 7000) newRank = 'Rookie';

    const { data: existingRank } = await supabaseClient
.from('rank_progress')
.select('email')
.eq('email', email)
.maybeSingle();

    if (existingRank) {
      await supabaseClient.from('rank_progress').update({
        current_rank: newRank,
        rank_start: totalSpent,
        updated_at: new Date().toISOString(),
      }).eq('email', email);
    } else {
      await supabaseClient.from('rank_progress').insert([{
        email: email,
        current_rank: newRank,
        rank_start: totalSpent,
        last_reset: new Date().toISOString(),
        updated_at: new Date().toISOString(),
      }]);
    }
  }

  function showPopup(message, type = "error") {
    let toast = document.querySelector('.airby-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.className = 'airby-toast';
      document.body.appendChild(toast);
    }
    toast.className = `airby-toast ${type}`;
    toast.innerText = message;
    setTimeout(() => toast.classList.add('show'), 50);
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  const list = document.getElementById("list");
  const modalBack = document.getElementById("modalBack");
  const modalName = document.getElementById("modalName");
  const modalSymbol = document.getElementById("modalSymbol");
  const modalPrice = document.getElementById("modalPrice");
  const buyAmountNaira = document.getElementById("buyAmountNaira");
  const calculatedTokens = document.getElementById("calculatedTokens");
  const buyBtn = document.getElementById("buyBtn");
  const btnText = document.getElementById("btnText");
  const btnLoader = document.getElementById("btnLoader");
  const amountRow = document.getElementById("amountRow");
  const searchInput = document.getElementById("searchInput");

  let tokens = [];
  let filteredTokens = [];
  let selectedToken = null;
  let realtimeChannel = null;
  let chart = null;
  let candleSeries = null;
  let lastCandleTime = null;
  let priceHistory = [];

  async function fetchTokens() {
    const { data, error } = await supabaseClient
.from("tokens")
.select("*")
.eq("status", "active")
.order("updated_at", { ascending: false });
    if (error) return showPopup("Error loading tokens");
    tokens = data || [];
    filteredTokens = [...tokens];
    renderList();
    setupRealtimeUpdates();
  }

  function renderList() {
    list.innerHTML = "";
    if (!filteredTokens.length) return (list.innerHTML = '<div class="empty">No tokens found</div>');
    filteredTokens.forEach(t => {
      const c = document.createElement("div");
      c.className = "card";
      c.dataset.tokenId = t.id;
      c.onclick = () => openModal(t);
      const left = document.createElement("div");
      left.className = "left";
      const logo = document.createElement("div");
      logo.className = "logo";
      if (t.logo_url) {
        const img = document.createElement("img");
        img.src = t.logo_url;
        img.style.width = "100%";
        img.style.height = "100%";
        img.style.objectFit = "cover";
        logo.appendChild(img);
      } else logo.innerText = (t.symbol || "TK").slice(0, 3).toUpperCase();

      const info = document.createElement("div");
      info.className = "token-info";
      info.innerHTML = `<div class="name">${t.name}</div><div class="symbol">${t.symbol}</div>`;
      left.append(logo, info);

      const price = document.createElement("div");
      price.className = "price";
      price.innerText = `₦${Number(t.current_price).toLocaleString()}`;
      price.dataset.price = t.id;
      c.append(left, price);
      list.appendChild(c);
    });
  }

  function setupRealtimeUpdates() {
    if (realtimeChannel) {
      supabaseClient.removeChannel(realtimeChannel);
    }

    realtimeChannel = supabaseClient
.channel('tokens-buy-page-updates')
.on('postgres_changes', {
        event: 'UPDATE',
        schema: 'public',
        table: 'tokens'
      }, (payload) => {
        console.log('Token price updated:', payload);
        handlePriceUpdate(payload.new);
      })
.subscribe();
  }

  function handlePriceUpdate(updatedToken) {
    const tokenIndex = tokens.findIndex(t => t.id === updatedToken.id);
    if (tokenIndex === -1) return;

    tokens[tokenIndex] = updatedToken;

    const filteredIndex = filteredTokens.findIndex(t => t.id === updatedToken.id);
    if (filteredIndex!== -1) {
      filteredTokens[filteredIndex] = updatedToken;
    }

    const priceEl = document.querySelector(`[data-price="${updatedToken.id}"]`);
    if (priceEl) {
      priceEl.innerText = `₦${Number(updatedToken.current_price).toLocaleString()}`;
      priceEl.style.transition = 'color 0.3s';
      priceEl.style.color = '#0066ff';
      setTimeout(() => priceEl.style.color = '#ffffff', 300);
    }

    if (selectedToken && selectedToken.id === updatedToken.id) {
      selectedToken.current_price = updatedToken.current_price;
      modalPrice.innerText = `₦${Number(updatedToken.current_price).toLocaleString()}`;

      const v = parseFloat(buyAmountNaira.value) || 0;
      const qty = selectedToken.current_price > 0? v / Number(selectedToken.current_price) : 0;
      calculatedTokens.innerText = `You will receive: ${qty? qty.toFixed(8) : 0} ${selectedToken.symbol}`;

      updateChartWithNewPrice(Number(updatedToken.current_price));
      showPopup('Price updated!', 'success');
    }
  }

    async function initChart(token) {
    const chartContainer = document.getElementById('chartContainer');
    chartContainer.innerHTML = '';

    chart = LightweightCharts.createChart(chartContainer, {
      width: chartContainer.clientWidth,
      height: 200,
      layout: {
        background: { color: '#000000' },
        textColor: '#666666',
      },
      grid: {
        vertLines: { color: '#1c1c1e' },
        horzLines: { color: '#1c1c1e' },
      },
      rightPriceScale: {
        borderColor: '#1c1c1e',
        scaleMargins: {
          top: 0.1,
          bottom: 0.1,
        },
      },
      timeScale: {
        borderColor: '#1c1c1e',
        timeVisible: true,
        secondsVisible: true,
        barSpacing: 8, // <-- ADD THIS: Fixes fat candles
        minBarSpacing: 4, // <-- ADD THIS: Minimum width
      },
    });

    candleSeries = chart.addCandlestickSeries({
      upColor: '#34c759',
      downColor: '#ff3b30',
      borderUpColor: '#34c759',
      borderDownColor: '#ff3b30',
      wickUpColor: '#34c759',
      wickDownColor: '#ff3b30',
    });

    const candles = await loadTokenPriceHistory(token.id, token.current_price);
    candleSeries.setData(candles);

    // Auto-fit the chart to visible data
    chart.timeScale().fitContent();

    const now = Math.floor(Date.now() / 1000);
    lastCandleTime = candles[candles.length - 1]?.time || now;
    priceHistory = candles.map(c => ({ time: c.time, price: c.close }));
  }

    async function loadTokenPriceHistory(tokenId, currentPrice) {
    const { data: history, error } = await supabaseClient
.from('token_price_history')
.select('price, created_at')
.eq('token_id', tokenId)
.order('created_at', { ascending: true })
.limit(1000);

    if (history && history.length > 0) {
      const candles = [];
      let prevPrice = null;

      history.forEach((h, index) => {
        const time = Math.floor(new Date(h.created_at).getTime() / 1000);
        const price = Number(h.price);

        // For the first candle, open = price
        // For others, open = previous close
        const open = prevPrice!== null? prevPrice : price;

        candles.push({
          time: time,
          open: open,
          high: Math.max(open, price),
          low: Math.min(open, price),
          close: price
        });

        prevPrice = price; // Next candle's open = this candle's close
      });

      // FIX: If only 1 candle, create a fake previous one so it's not a flat line
      if (candles.length === 1) {
        const singleCandle = candles[0];
        const prevTime = singleCandle.time - 300; // 5 minutes before
        const prevPrice = singleCandle.close * 0.99; // 1% lower
        candles.unshift({
          time: prevTime,
          open: prevPrice,
          high: Math.max(prevPrice, singleCandle.open),
          low: Math.min(prevPrice, singleCandle.open),
          close: singleCandle.open
        });
      }

      console.log(`Loaded ${candles.length} candles from DB for token ${tokenId}`);
      return candles;
    }

    // Fallback: if no history, create 30 random candles so chart isn't empty
    const now = Math.floor(Date.now() / 1000);
    const basePrice = Number(currentPrice);
    const candles = [];
    let lastClose = basePrice * 0.95;

    for (let i = 30; i >= 0; i--) {
      const time = now - (i * 300); // 5-min intervals
      const volatility = basePrice * 0.01;
      const open = lastClose;
      const close = open + (Math.random() - 0.5) * volatility;
      const high = Math.max(open, close) + Math.random() * volatility * 0.5;
      const low = Math.min(open, close) - Math.random() * volatility * 0.5;
      candles.push({ time, open, high, low, close });
      lastClose = close;
    }
    return candles;
  }

  function updateChartWithNewPrice(newPrice) {
    if (!candleSeries ||!selectedToken) return;

    const now = Math.floor(Date.now() / 1000);
    const currentBucket = Math.floor(now / 5) * 5;

    if (!lastCandleTime || currentBucket > lastCandleTime) {
      const lastPrice = priceHistory[priceHistory.length - 1]?.price || newPrice;
      candleSeries.update({
        time: currentBucket,
        open: lastPrice,
        high: Math.max(lastPrice, newPrice),
        low: Math.min(lastPrice, newPrice),
        close: newPrice
      });
      lastCandleTime = currentBucket;
    } else {
      const lastCandle = priceHistory[priceHistory.length - 1];
      if (lastCandle) {
        candleSeries.update({
          time: currentBucket,
          open: lastCandle.price,
          high: Math.max(lastCandle.price, newPrice),
          low: Math.min(lastCandle.price, newPrice),
          close: newPrice
        });
      }
    }

    priceHistory.push({ time: now, price: newPrice });
    if (priceHistory.length > 500) priceHistory.shift();

    // Auto-fit after update
    chart.timeScale().fitContent();
  }

  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim().toLowerCase();
    filteredTokens = tokens.filter(t =>
      t.name.toLowerCase().includes(q) || t.symbol.toLowerCase().includes(q)
    );
    renderList();
  });

  async function openModal(token) {
    selectedToken = token;
    modalName.innerText = token.name;
    modalSymbol.innerText = token.symbol;
    modalPrice.innerText = `₦${Number(token.current_price).toLocaleString()}`;
    buyAmountNaira.value = "";
    calculatedTokens.innerText = "You will receive: 0 tokens";
    clearAnimationClasses();
    modalBack.style.display = "flex";
    await initChart(token);
  }

  function closeModal() {
    modalBack.style.display = "none";
    selectedToken = null;
    resetButtonUI();
    if (chart) {
      chart.remove();
      chart = null;
      candleSeries = null;
    }
  }

  function clearAnimationClasses() {
    amountRow.classList.remove("neon-blue-glow", "neon-green-glow", "neon-red-glow", "shake-row");
  }

  function resetButtonUI() {
    btnText.style.display = "block";
    btnLoader.style.display = "none";
    buyBtn.disabled = false;
  }

  buyAmountNaira.addEventListener("input", () => {
    const v = parseFloat(buyAmountNaira.value) || 0;
    const qty = selectedToken && selectedToken.current_price > 0? v / Number(selectedToken.current_price) : 0;
    calculatedTokens.innerText = `You will receive: ${qty? qty.toFixed(8) : 0} ${selectedToken? selectedToken.symbol : ""}`;
    clearAnimationClasses();
    if (v > 0) amountRow.classList.add("neon-blue-glow");
  });

  modalBack.addEventListener("click", e => { if (e.target === modalBack) closeModal(); });

  buyBtn.addEventListener("click", async () => {
    if (!selectedToken) return;
    const nairaAmount = parseFloat(buyAmountNaira.value);
    if (!nairaAmount || nairaAmount <= 0) {
      showPopup("Enter a valid amount", "error");
      clearAnimationClasses();
      amountRow.classList.add("neon-red-glow", "shake-row");
      setTimeout(() => amountRow.classList.remove("shake-row"), 400);
      return;
    }

    if (!email) return showPopup("Please login first", "error");

    btnText.style.display = "none";
    btnLoader.style.display = "block";
    buyBtn.disabled = true;

    try {
      const tokensToReceive = nairaAmount / Number(selectedToken.current_price);

      const { data, error } = await supabaseClient.rpc('process_token_purchase', {
        p_email: email,
        p_token_id: selectedToken.id,
        p_token_name: selectedToken.name,
        p_token_symbol: selectedToken.symbol,
        p_naira_amount: nairaAmount,
        p_token_price: Number(selectedToken.current_price),
        p_tokens_to_receive: tokensToReceive
      });

      if (error) throw error;
      if (!data.success) {
        showPopup(data.message, "error");
        clearAnimationClasses();
        amountRow.classList.add("neon-red-glow", "shake-row");
        setTimeout(() => amountRow.classList.remove("shake-row"), 400);
        resetButtonUI();
        return;
      }

      await autoUpdateRank(email);

      clearAnimationClasses();
      amountRow.classList.add("neon-green-glow");
      showPopup(`You bought ${tokensToReceive.toFixed(6)} ${selectedToken.symbol}`, "success");

      setTimeout(() => {
        closeModal();
      }, 1500);

    } catch (e) {
      console.error(e);
      showPopup("Something went wrong. Try again.", "error");
      clearAnimationClasses();
      amountRow.classList.add("neon-red-glow");
      resetButtonUI();
    }
  });

  window.addEventListener('beforeunload', () => {
    if (realtimeChannel) {
      supabaseClient.removeChannel(realtimeChannel);
    }
  });

  fetchTokens();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js');
  });
}
</script>
</body>
