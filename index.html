<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AirBy - Trading Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0066ff">
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .market-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.12;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
      pointer-events: none;
    }

    .candle-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 12px;
      position: relative;
    }

    .wick {
      width: 2px;
      height: 120px;
      background-color: #34c759;
    }

    .real-body {
      width: 14px;
      height: 50px;
      background-color: #34c759;
      border-radius: 3px;
      position: absolute;
      animation: marketFluctuation 4s ease-in-out infinite alternate;
    }

    .c1 .real-body { animation-delay: 0s; height: 60px; }
    .c2 .real-body { animation-delay: 0.8s; height: 40px; background-color: #30b34e; }
    .c3 .real-body { animation-delay: 1.5s; height: 75px; }
    .c4 .real-body { animation-delay: 0.3s; height: 35px; }
    .c5 .real-body { animation-delay: 2.1s; height: 55px; }

    @keyframes marketFluctuation {
      0% { transform: translateY(-15px); }
      100% { transform: translateY(15px); }
    }

    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 24px calc(24px + env(safe-area-inset-bottom)) 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      position: relative;
      z-index: 10;
    }

    .top-header-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding-top: calc(10px + env(safe-area-inset-top));
      margin-bottom: 18px;
    }

    .brand-logo-center {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #ffffff;
      text-align: center;
      grid-column: 2;
    }

    .brand-logo-center .accent-tick {
      color: #0066ff;
      font-weight: 900;
    }

    .left-actions-group {
      grid-column: 1;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .right-actions-group {
      grid-column: 3;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .profile-nav-trigger,
    .admin-shield-trigger {
      width: 44px;
      height: 44px;
      background: #0b0b0c;
      border: 1.5px solid #1c1c1e;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.25s ease;
      overflow: hidden;
      cursor: pointer;
    }

    .profile-nav-trigger svg,
    .admin-shield-trigger svg {
      width: 20px;
      height: 20px;
      stroke: #ffffff;
      stroke-width: 2;
      fill: none;
    }

    .profile-nav-trigger svg {
      width: 100%;
      height: 100%;
      stroke: none;
    }

    .admin-shield-trigger {
      display: none;
      border-color: #ff3b30;
    }

    .admin-shield-trigger svg {
      stroke: #ff3b30;
    }

    .profile-nav-trigger:active,
    .admin-shield-trigger:active {
      transform: scale(0.9);
      border-color: #0066ff;
    }

    .guest-auth-banner {
      display: none;
      gap: 6px;
    }

    .guest-btn {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .guest-btn.login-type {
      background: #1c1c1e;
      color: #ffffff;
      border: 1.5px solid #2c2e;
    }

    .guest-btn.signup-type {
      background: #0066ff;
      color: #ffffff;
    }

    .guest-btn:active {
      transform: scale(0.93);
    }

    .greeting-banner {
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .greeting-banner h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .greeting-banner p {
      margin: 4px 0 0 0;
      color: #7d7d7d;
      font-size: 14px;
      font-weight: 500;
    }

    .wallet-balance-card {
      width: 100%;
      background: #0b0b0c;
      border: 1.5px solid #1c1c1e;
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.25s ease;
      cursor: pointer;
    }

    .wallet-balance-card:active {
      transform: scale(0.98);
      border-color: #0066ff;
    }

    .wallet-balance-card span {
      font-size: 13px;
      color: #666666;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .wallet-balance-card h1 {
      font-size: 34px;
      font-weight: 800;
      color: #ffffff;
      margin: 6px 0 0 0;
      letter-spacing: -1px;
    }

    .control-dashboard-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .grid-node-card {
      background: #0b0b0c;
      border: 1.5px solid #1c1c1e;
      border-radius: 20px;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .grid-node-card svg {
      width: 26px;
      height: 26px;
      stroke: #0066ff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .grid-node-card span {
      font-size: 14px;
      font-weight: 600;
      color: #aeaeb2;
    }

    .grid-node-card:active {
      transform: scale(0.92);
      border-color: #0066ff;
      background: rgba(0, 102, 255, 0.03);
    }

    .grid-node-card:active svg {
      transform: scale(1.15);
    }

    .tokens-full-width-card {
      grid-column: span 2;
      border-color: rgba(0, 102, 255, 0.25);
      background: linear-gradient(135deg, #0b0b0c 0%, #02122c 100%);
    }

    .tokens-full-width-card svg {
      stroke: #34c759;
    }

    .airby-toast {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      background: #ff3b30;
      color: #ffffff;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0px 16px 32px rgba(0, 0, 0, 0.8);
      z-index: 9999;
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
    }

    .airby-toast.reveal {
      top: calc(24px + env(safe-area-inset-top));
    }

    .trophy-blur-container {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .trophy-blur-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .trophy-box-card {
      background: #0b0c;
      border: 1.5px solid #0066ff;
      border-radius: 28px;
      width: 85%;
      max-width: 320px;
      padding: 30px;
      text-align: center;
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 40px rgba(0, 102, 255, 0.3);
    }

    .trophy-blur-container.active .trophy-box-card {
      transform: scale(1);
    }

    .trophy-box-card svg {
      width: 80px;
      height: 80px;
      stroke: #0066ff;
      stroke-width: 1.5;
      fill: none;
      margin-bottom: 16px;
    }

    .trophy-box-card h2 {
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: 800;
    }

    .trophy-box-card p {
      margin: 0;
      font-size: 15px;
      color: #aeaeb2;
    }

    /* MAINTENANCE OVERLAY */
    .maintenance-overlay {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 99999;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 24px;
      text-align: center;
    }

    .maintenance-overlay.active {
      display: flex;
    }

    .maintenance-overlay svg {
      width: 80px;
      height: 80px;
      stroke: #ff3b30;
      stroke-width: 1.5;
      fill: none;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .maintenance-overlay h1 {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 12px 0;
      letter-spacing: -1px;
    }

    .maintenance-overlay p {
      font-size: 16px;
      color: #7d7d;
      max-width: 300px;
      line-height: 1.5;
      margin: 0;
    }

    .maintenance-admin-btn {
      margin-top: 24px;
      padding: 14px 28px;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .maintenance-admin-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <div class="market-background">
    <div class="candle-container c1"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c2"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c3"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c4"><div class="wick"></div><div class="real-body"></div></div>
    <div class="candle-container c5"><div class="wick"></div><div class="real-body"></div></div>
  </div>

  <!-- MAINTENANCE OVERLAY -->
  <div class="maintenance-overlay" id="maintenanceOverlay">
    <svg viewBox="0 0 24 24">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <h1>Under Maintenance</h1>
    <p id="maintenanceMessage">We are upgrading AirBy. Check back soon.</p>
  </div>

  <div class="app-container" id="mainApp">

    <div class="top-header-row">

      <div class="left-actions-group">
        <div class="admin-shield-trigger" id="admin_shield" onclick="protectedNavigation('admin.html')">
          <svg viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>

        <div class="guest-auth-banner" id="guest_auth_box">
          <a href="login.html" class="guest-btn login-type">Log In</a>
          <a href="signup.html" class="guest-btn signup-type">Register</a>
        </div>
      </div>

      <div class="brand-logo-center">
        AirBy<span class="accent-tick">'</span>
      </div>

      <div class="right-actions-group">
        <div class="profile-nav-trigger"
             id="profile_avatar_trigger"
             onclick="protectedNavigation('profile.html')">

          <svg viewBox="0 0 24 24">
            <path d="M20 21v-2a4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>

        </div>
      </div>

    </div>

    <div class="greeting-banner">
      <h2 id="greeting_text">Good Day Trader</h2>
      <p>Welcome back to AirBy trading hub</p>
    </div>

    <div class="wallet-balance-card" onclick="protectedNavigation('history.html')">
      <span>Available Balance</span>
      <h1 id="balance_display">₦0</h1>
    </div>

    <div class="control-dashboard-grid">

      <div class="grid-node-card" onclick="protectedNavigation('deposit.html')">
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
        <span>Deposit</span>
      </div>

      <div class="grid-node-card" onclick="protectedNavigation('withdraw.html')">
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 5 19 12"></polyline>
        </svg>
        <span>Withdraw</span>
      </div>

      <div class="grid-node-card" onclick="protectedNavigation('history.html')">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>History</span>
      </div>

      <div class="grid-node-card" id="logout_node" onclick="triggerAccountSessionExit()">
        <svg viewBox="0 0 24 24">
          <path d="M9 21H5a2 0 0 1-2-2V5a2 2 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Logout</span>
      </div>

      <div class="grid-node-card tokens-full-width-card"
           onclick="protectedNavigation('tokens.html')">

        <svg viewBox="0 0 24 24">
          <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5"></polygon>
          <polyline points="2 8.5 12 15 22 8.5"></polyline>
          <line x1="12" y1="22" x2="12" y2="15"></line>
        </svg>

        <span>💎 Premium Token Asset Lists</span>

      </div>

    </div>

  </div>

  <div class="airby-toast" id="system_toast">
    Login to access full features
  </div>

  <div class="trophy-blur-container"
       id="trophy_window"
       onclick="this.classList.remove('active')">

    <div class="trophy-box-card">

      <svg viewBox="0 0 24 24">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
        <path d="M4 22h16"></path>
        <path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34"></path>
        <path d="M12 2a6 6 0 0 1 6 6v5a6 6 0 0 1-6 6 6 6 0 0 1-6-6V8a6 6 0 1 6-6z"></path>
      </svg>

      <h2>Congratulations!</h2>
      <p id="trophy_winnings_txt">You earned ₦0</p>

    </div>

  <script>
    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const balanceDisplay = document.getElementById("balance_display");
    const adminShieldNode = document.getElementById("admin_shield");
    const guestAuthBox = document.getElementById("guest_auth_box");
    const logoutNode = document.getElementById("logout_node");
    const greetingText = document.getElementById("greeting_text");
    const profileAvatarTrigger = document.getElementById("profile_avatar_trigger");
    const maintenanceOverlay = document.getElementById("maintenanceOverlay");
    const maintenanceMessage = document.getElementById("maintenanceMessage");
    const mainApp = document.getElementById("mainApp");

    let userSessionEmail = localStorage.getItem("user_email");
    let isUserAdmin = false;

    const SVGA_ALBUM_COLLECTION = {
      avatar1: `<svg viewBox="0 0 100 100"><defs><linearGradient id="av1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0066ff"/><stop offset="100%" stop-color="#002b80"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#av1)"/><circle cx="50" cy="42" r="16" fill="#fff" opacity="0.85"/><path d="M25 80c0-12 11-20 25-20s25 8 25 20z" fill="#fff" opacity="0.85"/></svg>`,
      avatar2: `<svg viewBox="0 0 100 100"><defs><linearGradient id="av2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#34c759"/><stop offset="100%" stop-color="#0f521e"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#av2)"/><circle cx="50" cy="42" r="16" fill="#fff" opacity="0.85"/><path d="M25 80c0-12 11-20 25-20s25 8 25 20z" fill="#fff" opacity="0.85"/></svg>`,
      avatar3: `<svg viewBox="0 0 100 100"><defs><linearGradient id="av3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff3b30"/><stop offset="100%" stop-color="#80110b"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#av3)"/><circle cx="50" cy="42" r="16" fill="#fff" opacity="0.85"/><path d="M25 80c0-12 11-20 25-20s25 8 25 20z" fill="#fff" opacity="0.85"/></svg>`
    };

    function displaySystemRestrictionToast() {
      const toast = document.getElementById("system_toast");
      toast.classList.add("reveal");
      setTimeout(() => {
        toast.classList.remove("reveal");
      }, 3000);
    }

    function protectedNavigation(targetDestinationRoute) {
      if (!userSessionEmail) {
        displaySystemRestrictionToast();
        return;
      }
      window.location.href = targetDestinationRoute;
    }

    async function triggerAccountSessionExit() {
      if (!userSessionEmail) {
        displaySystemRestrictionToast();
        return;
      }
      await supabaseClient.auth.signOut();
      localStorage.removeItem("user_email");
      window.location.href = "login.html";
    }

    function generateGreeting(displayName) {
      const currentHour = new Date().getHours();
      let greetingPrefix = "Good Day";
      if (currentHour >= 0 && currentHour <= 11) {
        greetingPrefix = "Good Morning";
      } else if (currentHour >= 12 && currentHour <= 16) {
        greetingPrefix = "Good Day";
      } else {
        greetingPrefix = "Good Evening";
      }
      greetingText.innerText = `${greetingPrefix}, ${displayName}`;
    }

    async function checkMaintenanceMode() {
      try {
        const { data, error } = await supabaseClient
          .from('site_settings')
          .select('maintenance_mode, maintenance_message')
          .eq('id', 1)
          .maybeSingle();

        if (error) throw error;

        if (data && data.maintenance_mode && !isUserAdmin) {
          maintenanceMessage.innerText = data.maintenance_message || 'We are upgrading AirBy. Check back soon.';
          maintenanceOverlay.classList.add('active');
          mainApp.style.display = 'none';
          return true;
        }
        return false;
      } catch (err) {
        console.error("Maintenance check failed:", err);
        return false;
      }
    }

    async function bootstrapEcosystemHub() {
      if (!userSessionEmail) {
        guestAuthBox.style.display = "flex";
        logoutNode.style.display = "none";
        balanceDisplay.innerText = "₦---";
        generateGreeting("Guest");
        await checkMaintenanceMode();
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('users')
          .select('balance, first_name, nickname, avatar_id, is_admin')
          .eq('email', userSessionEmail.toLowerCase())
          .maybeSingle();

        if (error) throw error;

        if (data) {
          balanceDisplay.innerText = `₦${Number(data.balance || 0).toLocaleString()}`;
          const displayName = data.nickname || data.first_name || "Trader";
          generateGreeting(displayName);

          const avatarId = data.avatar_id || "avatar1";
          if (SVGA_ALBUM_COLLECTION[avatarId]) {
            profileAvatarTrigger.innerHTML = SVGA_ALBUM_COLLECTION[avatarId];
          }

          isUserAdmin = data.is_admin || false;
          if (isUserAdmin) {
            adminShieldNode.style.display = "flex";
          }
        }

        // Check maintenance after knowing if user is admin
        await checkMaintenanceMode();
        initializeRealtimeBalanceChannel();

      } catch (err) {
        console.error("Internal data failure connecting account parameters:", err);
      }
    }

    function initializeRealtimeBalanceChannel() {
      supabaseClient
        .channel('realtime-balance-sync')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'users',
            filter: `email=eq.${userSessionEmail.toLowerCase()}`
          },
          (payload) => {
            if (payload.new) {
              if (payload.new.balance !== undefined) {
                balanceDisplay.innerText = `₦${Number(payload.new.balance).toLocaleString()}`;
              }
              const displayName = payload.new.nickname || payload.new.first_name || "Trader";
              generateGreeting(displayName);
              const avatarId = payload.new.avatar_id || "avatar1";
              if (SVGA_ALBUM_COLLECTION[avatarId]) {
                profileAvatarTrigger.innerHTML = SVGA_ALBUM_COLLECTION[avatarId];
              }
            }
          }
        )
        .subscribe();

      // Listen for maintenance mode changes
      supabaseClient
        .channel('maintenance-sync')
        .on(
          'postgres_changes',
          {
            event: 'UPDATE',
            schema: 'public',
            table: 'site_settings',
            filter: 'id=eq.1'
          },
          (payload) => {
            if (payload.new.maintenance_mode && !isUserAdmin) {
              maintenanceMessage.innerText = payload.new.maintenance_message || 'We are upgrading AirBy. Check back soon.';
              maintenanceOverlay.classList.add('active');
              mainApp.style.display = 'none';
            } else {
              maintenanceOverlay.classList.remove('active');
              mainApp.style.display = 'block';
            }
          }
        )
        .subscribe();
    }

    function checkRecentWinningsQueue() {
      const pendingWinAmount = localStorage.getItem('recent_win');
      if (pendingWinAmount && userSessionEmail) {
        document.getElementById("trophy_winnings_txt")
          .innerText = `You earned ₦${Number(pendingWinAmount).toLocaleString()}`;
        setTimeout(() => {
          document.getElementById("trophy_window").classList.add("active");
        }, 1200);
        localStorage.removeItem('recent_win');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      bootstrapEcosystemHub();
      checkRecentWinningsQueue();
    });
  </script>
  <script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js');
  });
}
</script>
